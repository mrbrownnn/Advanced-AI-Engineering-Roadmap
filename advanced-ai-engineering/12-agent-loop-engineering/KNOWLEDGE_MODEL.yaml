mechanisms:
  - id: "MECH-01"
    description: "A controller advances an explicit state through observe, propose, validate/authorize, execute, observe-result, and terminate transitions; the model proposes decisions but does not define execution truth."
    evidence_ids: ["CLM-001", "CLM-011"]
    derived_from: []
  - id: "MECH-02"
    description: "A versioned tool contract makes arguments, authority, side effects, retry safety, deadlines, outcomes, and completion evidence machine-checkable."
    evidence_ids: ["CLM-003", "CLM-004"]
    derived_from: ["MECH-01"]
  - id: "MECH-03"
    description: "An observation envelope preserves call identity, tool/version, request arguments, timing, raw and parsed output, error/effect state, truncation, and provenance before the next model decision."
    evidence_ids: ["CLM-009"]
    derived_from: ["MECH-02"]
  - id: "MECH-04"
    description: "The controller enforces orthogonal resource limits and workload-specific semantic terminal predicates, including verified success, explicit failure, safe abstention, and escalation. Limits whose worst case is bounded before dispatch are hard and are enforced by the reservation ledger of MECH-09; the others are estimates enforced by a conservative reservation plus a timeout/cancel backstop, with overruns reported."
    evidence_ids: ["CLM-005", "CLM-014", "CLM-015"]
    derived_from: ["MECH-01"]
  - id: "MECH-05"
    description: "Recovery classifies a failure before choosing retry, argument repair, backoff, alternative tool, replan, postcondition check, compensation/escalation, or termination."
    evidence_ids: ["CLM-006", "CLM-007"]
    derived_from: ["MECH-02", "MECH-03", "MECH-04"]
  - id: "MECH-06"
    description: "Progress and cycle detectors combine state deltas, action signatures, error classes, plan similarity, verified subgoals, and remaining budget; detection thresholds are evaluated against false stops and recovered success."
    evidence_ids: ["CLM-005", "CLM-010"]
    derived_from: ["MECH-01", "MECH-04", "MECH-05"]
  - id: "MECH-07"
    description: "Reflection or self-critique becomes a candidate state update, not proof; it must be grounded in external feedback, execution evidence, or a verifier before reuse."
    evidence_ids: ["CLM-008"]
    derived_from: ["MECH-03", "MECH-05"]
  - id: "MECH-08"
    description: "Trajectory evaluation slices task outcome, effect correctness, policy violations, intervention, recovery, resource use, latency, and cost rather than collapsing all behavior into final-answer success."
    evidence_ids: ["CLM-012", "CLM-013"]
    derived_from: ["MECH-01", "MECH-04", "MECH-05", "MECH-06"]
  - id: "MECH-09"
    description: "Pre-dispatch reservation ledger: per resource keep limit B, committed C, reserved R; admit an action only if C + R + q <= B for every hard resource, with compare and add atomic (required for parallel fan-out); reject before dispatch otherwise; reconcile actual charges on completion and release the hold (refund); keep the hold after cancellation or timeout until usage is known. Nested retries are reserved as (1 + inner retries) physical attempts per logical call. Every child timeout is bounded by the remaining root deadline minus a verification reserve."
    evidence_ids: ["CLM-015", "CLM-016"]
    derived_from: ["MECH-04", "MECH-05"]

mathematical_models:
  - id: "MATH-01"
    description: "Represent an episode as tau=(s_0,a_0,o_1,s_1,...,a_{T-1},o_T,s_T), with controller transition s_{t+1}=F(s_t,a_t,o_{t+1}). This is exact bookkeeping for a declared state schema; it is not a Markov model unless s_t is sufficient for future behavior."
    evidence_ids: ["CLM-001", "CLM-009"]
    derived_from: ["MECH-01", "MECH-03"]
  - id: "MATH-02"
    description: "For budget vector B=(B_steps,B_model,B_tool,B_tokens,B_time,B_cost,B_repeat,B_errors), the enforced invariant is C_r + R_r <= B_r for every hard resource r at all times, and an action a is admitted only if C_r + R_r + q_r(a) <= B_r for all r. A check of consumed < limit alone does not bound the next action. Model-call cost reservation = exact input tokens x input price + maximum output tokens x output price; worst-case physical attempts = k_c(1 + k_s). Limits have their native units and do not imply successful completion."
    evidence_ids: ["CLM-005", "CLM-014", "CLM-015", "CLM-016", "CLM-017"]
    derived_from: ["MECH-04", "MECH-09"]
  - id: "MATH-03"
    description: "For a strictly sequential trajectory, elapsed work is the sum of controller, model, validation, tool, and observation-processing durations plus queue/network delays. Parallel or asynchronous branches require critical-path timing; summing all spans would overstate wall time."
    evidence_ids: ["CLM-001", "CLM-013"]
    derived_from: ["MECH-01", "MECH-08"]
  - id: "MATH-04"
    description: "Episode goodput under a declared SLO is verified-successful, policy-compliant episodes divided by wall-clock time; cost of success is total included spend divided by verified successes. Rejects, aborts, retries, and zero-success windows must remain in the denominator policy and cannot be silently dropped."
    evidence_ids: ["CLM-013"]
    derived_from: ["MECH-08"]

implementation_mechanisms:
  - id: "IMPL-01"
    description: "A deterministic controller owns transition validation, tool dispatch, authority checks, the budget ledger with atomic admission and reconciliation, deadline propagation, terminal states, and structured failure handling; model text is an input to that controller."
    evidence_ids: ["CLM-001", "CLM-004", "CLM-005", "CLM-011", "CLM-015"]
    derived_from: ["MECH-01", "MECH-02", "MECH-04", "MECH-09"]
  - id: "IMPL-02"
    description: "A trajectory ledger records state/event IDs, model and prompt versions, proposed and authorized actions, tool versions/arguments, observation envelopes, retries, budgets, terminal reason, effects, tokens, latency, and cost."
    evidence_ids: ["CLM-009", "CLM-013"]
    derived_from: ["MECH-03", "MECH-08"]
  - id: "IMPL-03"
    description: "The pinned LangGraph trace (re-read 2026-09-30, static) illustrates a tool-calling graph whose normal termination is the absence of model tool calls and whose guards (remaining_steps, recursion limit) count steps, not cost or time; its create_react_agent factory is explicitly deprecated and therefore cannot define a current universal architecture."
    evidence_ids: ["CLM-014"]
    derived_from: ["MECH-01", "MECH-04"]

failure_modes:
  - id: "FAIL-01"
    description: "Runaway execution exhausts tokens, calls, time, or money because success is asserted in prose and no independent budget or terminal predicate stops the loop."
    evidence_ids: ["CLM-005", "CLM-014"]
    derived_from: ["MECH-04", "MATH-02"]
  - id: "FAIL-09"
    description: "Budget overshoot: the loop checks only consumed budget, so one expensive action crosses the limit; or parallel branches each pass a non-atomic check; or inner client retries multiply attempts beyond the counted number; or a child call receives a fresh timeout and outlives the root deadline; or a cancelled call is refunded before its usage is known."
    evidence_ids: ["CLM-015", "CLM-016"]
    derived_from: ["MECH-09", "MATH-02"]
  - id: "FAIL-02"
    description: "Blind retry repeats a deterministic invalid request or duplicates a side effect whose commit state is unknown."
    evidence_ids: ["CLM-004", "CLM-006", "CLM-011"]
    derived_from: ["MECH-02", "MECH-05"]
  - id: "FAIL-03"
    description: "Semantic tool corruption returns syntactically valid but wrong data, which the loop treats as authoritative and propagates into later actions."
    evidence_ids: ["CLM-006", "CLM-007", "CLM-009"]
    derived_from: ["MECH-03", "MECH-05"]
  - id: "FAIL-04"
    description: "Oscillation alternates plans, tools, or states without measurable progress; retries look active while consuming the remaining budget."
    evidence_ids: ["CLM-007", "CLM-010"]
    derived_from: ["MECH-06"]
  - id: "FAIL-05"
    description: "Premature completion accepts a plausible final answer without checking required artifacts, state changes, constraints, or postconditions."
    evidence_ids: ["CLM-001", "CLM-004", "CLM-011"]
    derived_from: ["MECH-01", "MECH-02", "MECH-04"]
  - id: "FAIL-06"
    description: "Reflection poisoning stores a persuasive but false causal diagnosis and biases subsequent attempts toward the same failing path."
    evidence_ids: ["CLM-008"]
    derived_from: ["MECH-07"]
  - id: "FAIL-07"
    description: "Authority collapse lets a model-selected tool or untrusted observation expand permissions, skip approval, or substitute claimed success for an observed effect."
    evidence_ids: ["CLM-009", "CLM-011"]
    derived_from: ["MECH-01", "MECH-03"]
  - id: "FAIL-08"
    description: "Benchmark blindness reports only final task success and hides invalid side effects, excessive retries, human rescue, deadline misses, and cost."
    evidence_ids: ["CLM-012", "CLM-013"]
    derived_from: ["MECH-08", "MATH-04"]

production_connections:
  - id: "PROD-01"
    description: "Ship tool loops with versioned contracts, least-privilege authorization, independent budgets enforced by pre-dispatch reservation, semantic terminal checks, unknown-effect handling, full trajectory telemetry, canary limits, and a kill path."
    evidence_ids: ["CLM-004", "CLM-005", "CLM-006", "CLM-009", "CLM-011", "CLM-015"]
    derived_from: ["MECH-01", "MECH-02", "MECH-03", "MECH-04", "MECH-05", "IMPL-01", "IMPL-02"]
  - id: "PROD-02"
    description: "Release evaluation injects malformed arguments, permission denial, rate limits, timeouts, partial/unknown effects, semantic corruption, unavailable tools, and changing topology, then measures recovery and harm-adjusted utility by workload slice."
    evidence_ids: ["CLM-006", "CLM-007", "CLM-010", "CLM-012", "CLM-013"]
    derived_from: ["MECH-05", "MECH-06", "MECH-08"]

research_connections:
  - id: "RESEARCH-01"
    description: "ReAct, Toolformer, and Reflexion remain reference mechanism families for interleaved acting, learned tool use, and verbal feedback, but none establishes production runtime governance."
    evidence_ids: ["CLM-002", "CLM-003", "CLM-008"]
    derived_from: ["MECH-01", "MECH-02", "MECH-07"]
  - id: "RESEARCH-02"
    description: "ToolMaze (arXiv v1, 2026-06-04; abstract read 2026-09-30) adds benchmark evidence for dynamic replanning under explicit/implicit and transient/permanent perturbations; transfer to real tools and deployments remains unestablished."
    evidence_ids: ["CLM-007"]
    derived_from: ["MECH-05", "MECH-06", "MECH-08"]

