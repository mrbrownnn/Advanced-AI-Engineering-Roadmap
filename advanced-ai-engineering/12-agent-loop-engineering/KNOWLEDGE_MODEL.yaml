candidate_capabilities:
  - { capability: "Implement a bounded observe-decide-act controller with explicit state, authority, transitions, and terminal outcomes.", mapped_mechanisms: ["MECH-01", "MECH-04", "MECH-09", "MATH-01", "MATH-02", "IMPL-01", "FAIL-01", "FAIL-05", "FAIL-09"] }
  - { capability: "Design and validate tool and observation contracts that preserve side-effect and provenance semantics.", mapped_mechanisms: ["MECH-02", "MECH-03", "IMPL-02", "FAIL-02", "FAIL-03", "FAIL-07"] }
  - { capability: "Classify failures and choose retry, verification, replan, escalation, or stop without creating retry storms.", mapped_mechanisms: ["MECH-05", "MECH-06", "FAIL-02", "FAIL-04", "PROD-02"] }
  - { capability: "Use reflection as a tested candidate update and falsify its value against no-reflection and oracle-feedback baselines.", mapped_mechanisms: ["MECH-07", "FAIL-06", "RESEARCH-01"] }
  - { capability: "Evaluate complete trajectories for verified success, effects, violations, recovery, latency, resource use, and cost.", mapped_mechanisms: ["MECH-08", "MATH-03", "MATH-04", "FAIL-08", "PROD-01", "PROD-02"] }
