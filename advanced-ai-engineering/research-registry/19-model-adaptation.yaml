  - id: CLM-017
    claim: "Liu et al. (Understanding R1-Zero-Like Training, 2025) identify two biases in GRPO—dividing by response length |o_i| favors brevity among correct answers and length among incorrect answers, and dividing by the group reward standard deviation up-weights low-variance questions—and propose Dr. GRPO, which removes both normalizations."
    provenance: VERIFIED_FACT
    domain: rl_finetuning
    concepts: [grpo, grpo_bias, length_bias]
    confidence: high
    currentness_status: "FRONTIER"
    evidence: [{ source_type: paper, tier: 1, title: "Understanding R1-Zero-Like Training: A Critical Perspective", authors: "Zichen Liu, Changyu Chen, Wenjun Li, Penghui Qi, Tianyu Pang, Chao Du, Wee Sun Lee, Min Lin", year: "2025", url: "https://arxiv.org/abs/2503.20783", section: "Sections 3.1-3.2", accessed_at: "2026-09-30" }]
    limitations: ["Reported for math-reasoning RL on evaluated base models; benchmark numbers are not transferred."]
    applicability: "Diagnosing response-length growth during GRPO-style training."
    related_claims: [CLM-010]
