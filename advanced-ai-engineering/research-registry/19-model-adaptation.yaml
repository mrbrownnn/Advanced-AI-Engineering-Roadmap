    claim: "DAPO (Yu et al., 2025) combines Clip-Higher, Dynamic Sampling, token-level policy-gradient loss, and overlong reward shaping; Dynamic Sampling over-samples and filters out prompts whose sampled outputs are all correct or all incorrect so that every prompt in the batch carries a non-zero gradient."
    provenance: VERIFIED_FACT
    domain: rl_finetuning
    concepts: [grpo, zero_advantage, dynamic_sampling]
    confidence: high
    currentness_status: "FRONTIER"
    evidence: [{ source_type: paper, tier: 1, title: "DAPO: An Open-Source LLM Reinforcement Learning System at Scale", authors: "Qiying Yu, Zheng Zhang, Ruofei Zhu, Yufeng Yuan, et al.", year: "2025", url: "https://arxiv.org/abs/2503.14476", section: "Section 1; Section 3.2 Dynamic Sampling (Eq. 11)", accessed_at: "2026-09-30" }]
    limitations: ["Filtering changes the effective training distribution and sampling cost; reported AIME results are specific to the paper's model and data."]
    applicability: "Handling the zero-advantage case of MATH-04."
    related_claims: [CLM-010, CLM-017]
    curriculum_usage: { lessons: ["19.5"], labs: ["LAB-C"], assessments: ["Mastery-19"] }
