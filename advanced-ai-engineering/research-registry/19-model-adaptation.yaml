    confidence: medium
    currentness_status: "FRONTIER"
    evidence: [{ source_type: paper, tier: 1, title: "RL's Razor: Why Online Reinforcement Learning Forgets Less", authors: "Idan Shenfeld, Jyothish Pari, Pulkit Agrawal", year: "2025", url: "https://arxiv.org/abs/2509.04259", section: "Abstract (abstract-level inspection)", accessed_at: "2026-09-30" }]
    limitations: ["Preprint; evaluated LLM and robotics settings only; KL on the new task is a predictor to validate per workload, not a guarantee."]
