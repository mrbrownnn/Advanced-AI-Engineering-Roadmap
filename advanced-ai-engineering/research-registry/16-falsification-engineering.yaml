    confidence: medium
    currentness_status: "WORKLOAD-DEPENDENT / SYNTHETIC FIXTURE"
    assumptions: ["The toy model rules are exactly those listed in Lesson 16.2.", "Generator seed 16 (Python random.Random), second generated case.", "Timing-race variant: acknowledgement latency log-normal with median 80 ms and sigma 0.5, timeout 100 ms, replay seed 163."]
    derivation: "The toy model was executed deterministically. Shrink order: delete steps from the last, simplify faults in the order none < req_lost < ack_lost, set amount to 1, restart after each accepted step. Mutation score = killed/(generated - equivalent) = 2/5 and 4/5. Exact binomial interval for 7 of 20 is [0.154, 0.592]; the model probability of the race is 1 - Phi(ln(100/80)/0.5) = 0.328."
