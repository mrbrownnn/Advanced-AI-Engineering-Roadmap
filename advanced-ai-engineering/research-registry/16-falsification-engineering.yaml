      measurement_method: "Deterministic execution of the toy model outside the repository; seeded pseudo-random replay for the timing-race variant."
    limitations: ["The toy model is not in the repository; the README states its rules so it can be rebuilt.", "Six hand-written mutants are not an operator distribution.", "Nothing here is evidence about any real payment system, client library, or testing tool."]
