  - id: CLM-016
    claim: "Recall@k is not monotonic under corpus growth at fixed k: adding one higher-scoring irrelevant document can move Recall@1 from 1 to 0, and with a corpus-dependent scorer such as BM25 added documents can reorder existing ones in either direction. Recall@k' >= Recall@k does hold when the query, corpus snapshot, scorer version, and tie-break are identical, retrieval is exact (a prefix of one deterministic total order), the relevance set is identical and non-empty, and k' >= k."
    provenance: DERIVED
    domain: metamorphic_testing
    concepts: [metamorphic_relation, recall_at_k, input_relation_validator]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE / MODULE DERIVATION"
    assumptions: ["Recall@k = |Rel intersect Top_k| / |Rel| with Rel non-empty.", "For the valid relation: exact retrieval returns a prefix of one fixed total order.", "For the BM25 illustration: tf=1, no length normalization, idf = ln(1 + (N-n+0.5)/(n+0.5))."]
    derivation: "Counterexample: k=1, relevant document score 0.8; add an irrelevant document with score 0.9; it takes rank 1, so Recall@1 falls from 1 to 0. BM25 illustration: corpus d1={a}, d2={b}, d3={b}, d4={c}, query {a,b}: scores d1=1.204, d2=d3=0.693. After adding three documents containing only a: idf(a)=0.575, idf(b)=1.163, so d2 outranks d1; Recall@1 rises 0 to 1 if Rel={d2} and falls 1 to 0 if Rel={d1}. Valid relation: with one fixed total order, Top_k is a prefix of Top_k' for k' >= k, so Rel intersect Top_k is a subset of Rel intersect Top_k' and the denominator is unchanged."
    limitations: ["An approximate index does not satisfy the exact-ranking precondition; its top-k need not be nested across k.", "A validator that reads the manifest trusts the manifest; exactness should be confirmed by brute-force recomputation on a sample.", "The relation says nothing about whether the relevance judgments are complete."]
    applicability: "Metamorphic checks on retrieval and ranking components."
    related_claims: ["CLM-004", "CLM-005"]
    curriculum_usage: { lessons: ["16.3"], labs: ["LAB-B"], assessments: ["Mastery-16"] }
