  - id: CLM-018
    claim: "A shrink step is valid only if the candidate stays inside the declared domain and fails with the same failure signature, defined here as (violated invariant, causal boundary, receiver-side effect count); an engine predicate based on exception type and source location is weaker, so each invariant should be raised from its own line or exception type and the effect count asserted inside the test."
    provenance: DERIVED
    domain: property_based_testing
    concepts: [shrinker, failure_signature, validity_domain]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE / MODULE DERIVATION"
    assumptions: ["The requirement names a receiver-side observable effect.", "Domain validity can be checked for every candidate.", "The engine identifies failures by exception origin, as observed in CLM-017."]
    derivation: "A candidate outside the domain is not an input the requirement covers, so its failure is not a counterexample. A candidate that fails a different invariant, or the same invariant with a different effect count or causal boundary, is a different defect; replacing the original with it loses the evidence being minimized. Two invariants checked on one source line share an exception origin, so an origin-equality predicate cannot tell them apart."
    limitations: ["The signature is a modeling choice; too coarse merges defects and too fine blocks useful shrinking.", "Minimality is relative to shrink order and representation."]
    applicability: "Stateful and effectful property tests."
    related_claims: ["CLM-003", "CLM-012", "CLM-017"]
    curriculum_usage: { lessons: ["16.2"], labs: ["LAB-A"], assessments: ["Mastery-16", "Incident-16.1"] }
  - id: CLM-019
