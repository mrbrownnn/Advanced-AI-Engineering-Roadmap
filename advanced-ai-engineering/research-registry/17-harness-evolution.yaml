    confidence: high
    currentness_status: "CURRENT DEFAULT"
    evidence: [{ source_type: official_docs, tier: 2, title: "Canarying Releases (The Site Reliability Workbook)", authors: "Google SRE", year: "2018", url: "https://sre.google/workbook/canarying-releases/", section: "Canary definition; metric selection; before/after evaluation", accessed_at: "2026-09-27" }]
