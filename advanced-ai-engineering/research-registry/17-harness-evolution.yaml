  - id: CLM-014
    claim: "For independent Bernoulli outcomes, a normal-approximation equal-allocation size at which a two-sided level-alpha stop rule fires with probability 1-beta under an absolute canary drop delta is n per arm ≈ (z_{1-alpha/2}+z_{1-beta})^2 (p1(1-p1)+p2(1-p2))/delta^2; with control size r times canary size, n_canary ≈ (z_{1-alpha/2}+z_{1-beta})^2 (p2(1-p2)+p1(1-p1)/r)/delta^2. A shorter horizon has lower, not zero, detection probability."
    provenance: DERIVED
    domain: rollout_statistics
    concepts: [sample_size, statistical_power, canary_duration]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE / WHEN ASSUMPTIONS HOLD"
    assumptions: ["Independent request-level Bernoulli outcomes.", "Concurrent randomized assignment and stable traffic mix.", "Normal approximation; one fixed-horizon look."]
    derivation: "Var(p2_hat - p1_hat) = p2(1-p2)/n_c + p1(1-p1)/n_k. Setting delta equal to (z_{1-alpha/2}+z_{1-beta}) times that standard deviation gives both forms. Synthetic fixture (Lesson 17.5): 40 req/s, 5% canary, 10% graded, p1=0.95, p2=0.93 gives 2,210 per arm in 3.07 h with a 0.5263% graded-control subsample, or 1,327 canary and 25,213 control outcomes in 1.84 h under the natural 19:1 allocation. Seeded simulation (default_rng 175, 400,000 replications): detection 0.146 and false alarm 0.024 at 20 minutes with 240 per arm; 0.801 and 0.025 at the equal target; 0.170/0.011 and 0.821/0.017 for the unequal 20-minute and target designs."
    numeric_metadata:
      numeric_type: predicted_behavior
      workload: "Synthetic independent binomial arms; seeds 175 (fixed horizon and ten-look peeking) and 1750 (four-row sessions with ICC 0.3)."
      metric_definition: "Detection: fraction of replications whose 95% Wald upper bound on canary minus control is below zero under a 2-pp drop; false alarm: the same fraction under no drop."
      measurement_method: "Monte Carlo recomputed for this revision; Monte Carlo SE at most 0.00064 for the fixed-horizon rates."
    limitations: ["Ten unadjusted looks raised the false-alarm rate to about 0.097 in simulation; alpha/10 per look lowered detection to about 0.58 at the same maximum sample.", "Clustered sessions need block analysis; row analysis gave false alarms near 0.078 at ICC 0.3.", "Delayed or noisy graders and traffic drift are not modeled.", "This sizes a stop rule; ramp decisions use the margin gates of CLM-018."]
    applicability: "Choosing canary size and duration for quality guardrails."
    curriculum_usage: { lessons: ["17.5"], labs: ["LAB-D"], assessments: ["Mastery-17"] }
