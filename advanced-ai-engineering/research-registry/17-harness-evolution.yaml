    confidence: medium
    currentness_status: "FRONTIER"
    evidence: [{ source_type: paper, tier: 1, title: "GEPA: Reflective Prompt Evolution Can Outperform Reinforcement Learning", authors: "Lakshya A Agrawal, Shangyin Tan, Dilara Soylu, Noah Ziems, Rishi Khare, Krista Opsahl-Ong, Arnav Singhvi, Herumb Shandilya, Michael J Ryan, Meng Jiang, Christopher Potts, Koushik Sen, Alexandros G. Dimakis, Ion Stoica, Dan Klein, Matei Zaharia, Omar Khattab", year: "2025", url: "https://arxiv.org/abs/2507.19457", section: "Abstract (v2, February 2026)", accessed_at: "2026-09-27" }]
