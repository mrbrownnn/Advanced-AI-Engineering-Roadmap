  - id: CLM-010
    claim: "Selecting the best of K candidates by a noisy validation score biases the winner's validation score upward; with K candidates of equal true quality and independent Gaussian estimation noise sigma, the expected selected score exceeds the true score by sigma times the expected maximum of K standard normals."
    provenance: DERIVED
    domain: selection_bias
    concepts: [winners_curse, validation_reuse, optimizer_overfitting]
    confidence: high
    currentness_status: "CURRENT DEFAULT / WHEN ASSUMPTIONS HOLD"
    assumptions: ["Equal true quality, independent Gaussian noise of equal variance; a stylized model for the direction and scale of bias."]
    derivation: "Observed score = true + sigma*Z_k. The selected score is true + sigma*max_k Z_k, whose expectation is sigma*E[max of K standard normals] > 0 for K>=2 (about 1.54 sigma for K=10)."
    limitations: ["Correlated candidates and unequal true quality change the magnitude; the direction of optimistic bias remains for selection on the same data."]
    applicability: "Prompt search, model selection, and repeated evaluation on one validation set."
    curriculum_usage: { lessons: ["17.4"], labs: ["LAB-C"], assessments: ["Mastery-17"] }
