  - id: CLM-014
    claim: "To detect an absolute drop delta between canary and control success proportions with two-sided level alpha and power 1-beta, a normal-approximation per-arm sample size is n ≈ (z_{1-alpha/2}+z_{1-beta})^2 (p1(1-p1)+p2(1-p2)) / delta^2."
    provenance: DERIVED
    domain: rollout_statistics
    concepts: [sample_size, statistical_power, canary_duration]
    confidence: high
    currentness_status: "CURRENT DEFAULT / WHEN ASSUMPTIONS HOLD"
    assumptions: ["Independent request-level Bernoulli outcomes, randomized assignment, stable traffic mix, normal approximation."]
    derivation: "Standard two-proportion z-test sizing; e.g., p1=0.95, p2=0.93, delta=0.02, alpha=0.05, power 0.8 gives about 2,210 graded requests per arm."
    limitations: ["Clustered users/sessions, sequential peeking, and delayed or noisy graders increase the required sample."]
    applicability: "Choosing canary size and duration for quality guardrails."
    curriculum_usage: { lessons: ["17.5"], labs: ["LAB-D"], assessments: ["Mastery-17"] }
  - id: CLM-015
    claim: "A harness rollback is complete only if in-flight sessions, cached prompts/prefixes, stored structured outputs, tool-call schemas, and downstream consumers remain valid under the restored version; routing traffic back does not undo state written under the new version."
    provenance: DERIVED
    domain: rollback
    concepts: [rollback_state, schema_compatibility, dual_read]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    assumptions: ["The new version can persist state or emit artifacts consumed by other systems."]
    derivation: "Traffic routing controls future requests only. Artifacts already produced under the new schema or behavior persist and must be readable, migrated, or quarantined by the restored version."
    limitations: ["Stateless single-turn endpoints with no persisted outputs have a much smaller rollback surface."]
    applicability: "Multi-turn assistants, agents, and pipelines with persisted model outputs."
    curriculum_usage: { lessons: ["17.6"], labs: ["LAB-D"], assessments: ["Incident-17.1"] }
  - id: CLM-016
    claim: "Automatically re-optimizing prompts for each new model snapshot and shipping the best validation candidate will reduce migration regressions relative to reusing the old prompt, only when a sealed test set and paired regression gate are enforced."
    provenance: HYPOTHESIS
    domain: migration_strategy
    concepts: [reoptimization, sealed_test, regression_gate]
    confidence: medium
    currentness_status: "WORKLOAD-DEPENDENT"
    hypothesis:
      prediction: "Re-optimized prompts evaluated on a sealed test show lower paired regression rate b/n than the carried-over prompt at equal or better net accuracy."
      measurement_target: "Paired flips b and c on a sealed test, optimizer validation-to-test gap, cost, latency, and online canary guardrails."
      falsifying_observation: "Sealed-test regressions or online guardrail violations are equal or worse than the carried-over prompt, or the validation gain disappears on the sealed test."
    limitations: ["Depends on metric validity, data size, model family, and optimizer budget."]
    applicability: "Migration playbook design."
    curriculum_usage: { lessons: ["17.3", "17.4"], labs: ["LAB-C"], assessments: ["Mastery-17"] }
