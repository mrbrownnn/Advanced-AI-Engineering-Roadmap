  - id: CLM-013
    claim: "Google's SRE Workbook defines canarying as a partial, time-limited deployment evaluated against a control population, recommends starting canary metrics from SLIs and keeping them few, and cautions that before/after comparison is confounded by time."
    provenance: VERIFIED_FACT
