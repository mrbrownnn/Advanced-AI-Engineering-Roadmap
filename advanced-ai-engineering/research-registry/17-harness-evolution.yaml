  - id: CLM-006
    claim: "For a migration evaluated on the same n independent items, paired outcomes separate improvements c (old fail, new pass) from regressions b (old pass, new fail); net change (c-b)/n can be near zero while b is large, so aggregate score equality does not imply behavioral compatibility, and a critical slice can be refuted while the global gate is undetermined."
    provenance: DERIVED
    domain: migration_evaluation
    concepts: [paired_evaluation, regression_flip, net_change]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE / MODULE DERIVATION"
    assumptions: ["Binary per-item outcome under a fixed grader; both versions evaluated on the same frozen items.", "Each item is one independent block; otherwise the block analysis of CLM-018 applies."]
    derivation: "Accuracy difference equals (c-b)/n because concordant items cancel. Equal accuracies imply only c=b; users of the b items still experience regressions. Synthetic check (Lesson 17.2): n=2000, b=120, c=130 gives mean 0.005, s=0.3536, SE=0.00791, 95% t interval [-0.0105, 0.0205], so a 0.01 noninferiority gate is undetermined; a 300-item slice with b=90, c=10 gives [-0.3249, -0.2084], refuting a 0.02 margin, so the decision is HOLD."
    limitations: ["Repeated samples per item, sessions, or users are blocks, not independent rows.", "Grader changes confound flips.", "An exact sign test on discordant pairs tests no change; it does not replace a margin gate."]
    applicability: "Model, prompt, parser, and provider migrations."
    curriculum_usage: { lessons: ["17.2"], labs: ["LAB-B"], assessments: ["Mastery-17", "Incident-17.1"] }
