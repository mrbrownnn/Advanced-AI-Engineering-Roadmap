  - id: CLM-010
    claim: "In a toy model with K candidates of equal true quality and independent, equal-variance Gaussian validation noise sigma, the expected selected validation score exceeds the true score by sigma times the expected maximum of K standard normals (about 0.564, 1.163, 1.539, 1.867 sigma for K=2, 5, 10, 20); the toy is not a model of a real optimizer."
    provenance: DERIVED
    domain: selection_bias
    concepts: [winners_curse, validation_reuse, optimizer_overfitting]
    confidence: high
    currentness_status: "TOY MODEL / MODULE DERIVATION"
    assumptions: ["Equal true quality.", "Independent Gaussian noise of equal variance.", "Selection and reporting use the same validation sample."]
    derivation: "Observed score = true + sigma*Z_k. The selected score is true + sigma*max_k Z_k, whose expectation is sigma*E[max of K standard normals]. Numerical integration gives 0.5642, 1.1630, 1.5388, 1.8675 for K=2, 5, 10, 20; a one-million-replication Monte Carlo (NumPy default_rng seed 174) gives 0.5641, 1.1633, 1.5390, 1.8677 with SE at most 0.0008. Worked case m=200, p=0.8, K=20: sigma=0.02828 and toy bias 0.0528; a 400,000-replication binomial version gives 0.0513."
    numeric_metadata:
      numeric_type: predicted_behavior
      workload: "Synthetic Monte Carlo; NumPy default_rng seed 174."
      metric_definition: "Mean of the selected validation score minus its true score."
      measurement_method: "Numerical integration and seeded simulation, recomputed for this revision."
    limitations: ["Equicorrelated noise with rho=0.5 lowers the K=20 mean maximum to about 1.32 sigma in simulation.", "With unequal true quality part of the apparent gain is real: in one synthetic case the apparent gain is 5.48 pp and the real gain 0.74 pp.", "Real optimizer candidates are adaptive and dependent; see CLM-019."]
    applicability: "Prompt search, model selection, and repeated evaluation on one validation set."
    curriculum_usage: { lessons: ["17.4"], labs: ["LAB-C"], assessments: ["Mastery-17"] }
