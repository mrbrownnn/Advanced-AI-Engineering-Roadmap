module: "17-harness-evolution"
registry_version: "1.0.0"
research_cutoff: "2026-09-27"
change_reason: "Replace generated placeholders with a versioned harness-change, migration-evaluation, prompt-optimization, and controlled-rollout evidence model."
claims:
  - id: CLM-001
    claim: "A production harness is a versioned composite of model identifier, provider/runtime, request parameters, prompt templates, tool and output schemas, parsers, validators, retries, and routing; a change to any component can change behavior even when application code is unchanged."
    provenance: DERIVED
    domain: harness_versioning
    concepts: [harness_manifest, change_surface, effective_request]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    assumptions: ["The harness boundary and effective request are defined as in Module 13."]
    derivation: "Model output is a function of the effective request and the serving model. Each listed component alters either the effective request, the model that receives it, or the interpretation of its output, so each is a behavior-bearing version."
    limitations: ["Provider-side changes behind a stable identifier may be unobservable except through behavior."]
    applicability: "Hosted APIs, self-hosted runtimes, and multi-provider routers."
    curriculum_usage: { lessons: ["17.1"], labs: ["LAB-A"], assessments: ["Mastery-17"] }
  - id: CLM-002
    claim: "Anthropic's model lifecycle defines Active, Legacy, Deprecated, and Retired states; requests to retired models fail, deprecated models receive an announced retirement date and recommended replacement, and publicly released models receive at least 60 days' retirement notice on Anthropic-operated platforms."
    provenance: VERIFIED_FACT
    domain: provider_lifecycle
    concepts: [model_deprecation, retirement, migration_deadline]
    confidence: high
    currentness_status: "CURRENT DEFAULT / PROVIDER-SPECIFIC"
    evidence: [{ source_type: official_docs, tier: 2, title: "Model deprecations", authors: "Anthropic", year: "2026", url: "https://platform.claude.com/docs/en/about-claude/model-deprecations", section: "Overview; Notifications; Model status", accessed_at: "2026-09-27" }]
    limitations: ["Lifecycle terms, notice periods, and partner-platform schedules differ by provider and platform."]
    applicability: "Forced-migration planning for hosted model dependencies."
    curriculum_usage: { lessons: ["17.1", "17.6"], labs: ["LAB-A"], assessments: ["Incident-17.1"] }
  - id: CLM-003
    claim: "Anthropic documents that temperature, top_p, and top_k return a 400 error when set to non-default values on Claude Opus 4.7 and later models, and that the Python SDK v1.0+ removes those parameters, so a request valid for an older model can be rejected after a model-only upgrade."
    provenance: VERIFIED_FACT
    domain: parameter_compatibility
    concepts: [parameter_deprecation, capability_negotiation, request_validity]
    confidence: high
    currentness_status: "CURRENT / PROVIDER-SPECIFIC"
    evidence: [{ source_type: official_docs, tier: 2, title: "Model deprecations — API parameter deprecations", authors: "Anthropic", year: "2026", url: "https://platform.claude.com/docs/en/about-claude/model-deprecations", section: "API parameter deprecations", accessed_at: "2026-09-27" }]
    limitations: ["A single provider's parameter policy; it demonstrates the failure class rather than a cross-provider rule."]
    applicability: "Model-upgrade compatibility checks in harness adapters."
    curriculum_usage: { lessons: ["17.1"], labs: ["LAB-A"], assessments: ["Incident-17.1"] }
  - id: CLM-004
    claim: "Chen, Zaharia, and Zou compared March and June 2023 versions of GPT-3.5 and GPT-4 and reported substantial task-dependent behavior changes, including changed chain-of-thought responsiveness, refusal behavior, and code-formatting errors."
    provenance: VERIFIED_FACT
    domain: model_drift
    concepts: [behavior_drift, snapshot_change, longitudinal_monitoring]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    evidence: [{ source_type: paper, tier: 1, title: "How is ChatGPT's behavior changing over time?", authors: "Lingjiao Chen, Matei Zaharia, James Zou", year: "2023", url: "https://arxiv.org/abs/2307.09009", section: "Abstract and task-level comparisons", accessed_at: "2026-09-27" }]
    limitations: ["The specific rates concern 2023 service versions and selected tasks; they do not predict the direction or magnitude of any later model change."]
    applicability: "Motivation for version pinning and longitudinal behavior regression."
    curriculum_usage: { lessons: ["17.2"], labs: ["LAB-B"], assessments: ["Mastery-17"] }
  - id: CLM-005
    claim: "Sclar et al. show that meaning-preserving few-shot prompt-format changes can produce large accuracy differences, reporting up to 76 points for LLaMA-2-13B, and that format performance only weakly correlates across models."
    provenance: VERIFIED_FACT
    domain: prompt_sensitivity
    concepts: [format_sensitivity, prompt_transfer, performance_interval]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    evidence: [{ source_type: paper, tier: 1, title: "Quantifying Language Models' Sensitivity to Spurious Features in Prompt Design or: How I learned to start worrying about prompt formatting", authors: "Melanie Sclar, Yejin Choi, Yulia Tsvetkov, Alane Suhr", year: "2024", url: "https://arxiv.org/abs/2310.11324", section: "Abstract; FormatSpread", accessed_at: "2026-09-27" }]
    limitations: ["Measured on evaluated tasks, models, and format grammar; the spread for a new model/task must be measured."]
    applicability: "Why a prompt tuned for one model cannot be assumed optimal or safe for its replacement."
    curriculum_usage: { lessons: ["17.2", "17.3"], labs: ["LAB-B"], assessments: ["Mastery-17"] }
  - id: CLM-006
    claim: "For a migration evaluated on the same n items, paired outcomes separate improvements c (old fail, new pass) from regressions b (old pass, new fail); net change (c-b)/n can be near zero while b is large, so aggregate score equality does not imply behavioral compatibility."
    provenance: DERIVED
    domain: migration_evaluation
    concepts: [paired_evaluation, regression_flip, net_change]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    assumptions: ["Binary per-item outcome under a fixed grader; both versions evaluated on the same frozen items."]
    derivation: "Accuracy difference equals (c-b)/n because concordant items cancel. Equal accuracies imply only c=b; users of the b items still experience regressions."
    limitations: ["Stochastic outputs require repeated samples per item; grader changes confound flips."]
    applicability: "Model, prompt, parser, and provider migrations."
    curriculum_usage: { lessons: ["17.2"], labs: ["LAB-B"], assessments: ["Mastery-17", "Incident-17.1"] }
