  - id: CLM-017
    claim: "A manifest digest establishes which logged configuration served a request, not which component caused a behavior change; causal attribution needs a controlled one-change contrast, factorial ablation or replay for joint changes, or another discriminating intervention, and when those contrasts or logged state are missing the defensible report is an unknown or interacting cause."
    provenance: DERIVED
    domain: change_attribution
    concepts: [identity_evidence, causal_contrast, interaction_effect]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE / MODULE DERIVATION"
    assumptions: ["Replays use the same frozen, independently sampled items and grader.", "Execution conditions are stable across cells, or their variation is measured.", "Changed fields can be toggled independently."]
    derivation: "A digest is a function of the canonical manifest, so equal digests mean equal logged configurations; it carries no counterfactual. With two changed fields, the four cells A/A, B/A, A/B, B/B give main effects and the difference-of-differences interaction. Synthetic fixture (Lesson 17.1, 200 items): passes 192, 190, 190, 140; each single change is -1 pp, the joint change -26 pp, and the interaction (140-190)-(190-192) = -48 items, or -24 pp. Without the two single-change cells the joint regression cannot be assigned to either field."
    limitations: ["Provider-side changes behind a stable identifier and unlogged environment state can leave the cause unknown even after factorial replay.", "A full factorial over k binary fields needs 2^k configurations.", "The fixture is synthetic and shows an interaction, not its mechanism."]
    applicability: "Seeded change sets, multi-field migrations, and incident diagnosis."
    related_claims: ["CLM-001", "CLM-006"]
    curriculum_usage: { lessons: ["17.1"], labs: ["LAB-A"], assessments: ["Mastery-17", "Incident-17.1"] }
