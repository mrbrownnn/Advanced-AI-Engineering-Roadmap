  - id: CLM-004
    claim: "For a stable observed population with consistent boundaries, Little's Law relates long-run averages as L=lambda*W. Separately, an initially empty deterministic fluid model with constant arrival and departure rates, no loss, and lambda>mu gives Q(t)=(lambda-mu)t; that transient equation is not a consequence of Little's Law and is not a universal LLM queue trajectory."
    provenance: "DERIVED"
    domain: "queueing_theory"
    concepts:
      - "littles_law"
      - "arrival_rate"
      - "service_rate"
      - "queue_growth"
      - "stability_condition"
    confidence: "high"
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "The steady-state form of Little's Law uses a stable population, finite long-run averages, and identical arrival/residence boundaries."
      - "The fluid backlog equation additionally assumes constant rates, an initially empty queue, no drops/cancellations, and no state-dependent service-rate change."
    derivation: "Little's Law follows from time-average conservation of customer-time over a stable observation horizon. In the separate fluid exercise, cumulative arrivals are lambda*t and departures are mu*t while backlog remains positive, so Q(t)=max(0,(lambda-mu)t) from an initially empty queue."
    limitations:
      - "A finite-window transient needs boundary corrections or a sample-path formulation; plugging instantaneous burst rates into the steady-state identity is invalid."
      - "Batching, admission, cancellations, retries, and preemption can make effective departures state-dependent and invalidate the constant-rate fluid path."
    applicability: "Capacity planning, concurrency sizing, and queue residency estimation."
    curriculum_usage:
      lessons: ["4.4"]
      labs: ["LAB-C"]
      assessments: ["Mastery-04"]

  - id: CLM-005
    claim: "In a stable FCFS M/G/1 model, the Pollaczek-Khinchine mean is W_q=lambda*E[S^2]/(2*(1-rho))=lambda*(sigma_S^2+1/mu^2)/(2*(1-rho)). Under those assumptions, greater service-time variance raises mean waiting; the equation neither identifies the tail distribution nor makes output-length variance equal service-time variance in a batching LLM runtime."
    provenance: "DERIVED"
    domain: "queueing_theory"
    concepts:
      - "pollaczek_khinchine_formula"
      - "service_time_variance"
      - "traffic_intensity"
      - "queue_wait_inflation"
    confidence: "high"
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "Poisson arrival process (independent exponential inter-arrival times)."
      - "Single server queueing abstraction with general service distribution G."
      - "Independent, identically distributed service demands independent of arrivals."
      - "Work-conserving FCFS service discipline without service-time-dependent priorities."
      - "Utilization rho < 1."
    derivation: "From P-K transform: Mean residual service time seen by an arrival is R = lambda * E[S^2] / 2 = lambda * (sigma^2 + 1/mu^2) / 2. By Little's Law, W_q = R / (1 - rho)."
    limitations:
      - "LLM continuous batching is multi-tenant and multi-token per step rather than a pure single-server FCFS queue."
      - "Arrivals in real systems often exhibit burstiness with dispersion parameter > 1."
    applicability: "Mean-wait sensitivity analysis and a check on whether measured service-demand variance could materially affect average queue residence under an explicit M/G/1 approximation."
    curriculum_usage:
      lessons: ["4.4"]
      labs: ["LAB-C"]
      assessments: ["Mastery-04", "Incident-04.1"]

