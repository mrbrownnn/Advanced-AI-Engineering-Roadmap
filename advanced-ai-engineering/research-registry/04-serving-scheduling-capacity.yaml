  - id: CLM-008
    claim: "For a client-observed streamed request with N_out >= 2, T_e2e = TTFT + sum ITL_i and request-level TPOT = (T_e2e - TTFT)/(N_out - 1). Initial waiting before first output contributes to TTFT; pauses, preemption, network delivery, or scheduler delays after the first output can contribute to ITL."
    provenance: "DERIVED"
    domain: "latency_metrics"
    concepts:
      - "latency_decomposition"
      - "ttft"
      - "itl"
      - "tpot"
      - "e2e_latency"
    confidence: "high"
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "Streaming output where first token is emitted immediately upon prefill completion."
      - "N_out >= 2 for meaningful TPOT denominator."
    derivation: "By definition: Arrival at t0, scheduled at t1 (T_queue = t1 - t0), prefill finishes and token 1 emitted at t2 (T_TTFT = t2 - t0 = T_queue + (t2 - t1)). Subsequent tokens emitted at t3, ..., t_{N_out}. Total time is t_{N_out} - t0 = T_TTFT + sum(ITL_i)."
    limitations:
      - "Speculative decoding alters the 1-token-per-iteration assumption (addressed in Module 05)."
    applicability: "All latency profiling, SLO attribution, and bottleneck discrimination."
    curriculum_usage:
      lessons: ["4.1", "4.7"]
      labs: ["LAB-A", "LAB-B", "LAB-C"]
      assessments: ["Mastery-04", "Incident-04.1"]

  - id: CLM-009
    claim: "Under the stated M/G/1 assumptions, mean waiting contains a 1/(1-rho) term and diverges as rho approaches one; this supplies useful mean-value intuition but does not prove a universal knee location or tail-latency behavior for a batching LLM server."
    provenance: "DERIVED"
    domain: "capacity_planning"
    concepts:
      - "saturation_knee"
      - "utilization_cliff"
      - "capacity_headroom"
    confidence: "high"
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "A stable queueing model with finite mean service demand is a useful approximation over the observation window."
      - "Effective service capacity does not improve enough with added load to offset the increase in offered work."
    derivation: "In queueing models such as M/G/1, the mean waiting term contains a factor 1/(1-rho), so it diverges as rho approaches one. Real LLM servers can depart from this model because batching makes service rate state-dependent; the knee must therefore be measured."
    limitations:
      - "No exact utilization threshold transfers from this model to a state-dependent batching runtime; the workload-specific knee must be measured."
    applicability: "Production sizing, autoscaling triggers, and SLO headroom provisioning."
    related_claims: ["CLM-005", "CLM-009b"]
    curriculum_usage:
