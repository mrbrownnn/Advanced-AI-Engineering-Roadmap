claims:
  - id: CLM-001
    claim: "A distributed inference plan is a choice of what each GPU holds (replicated versus sharded weights, KV, experts, or sequence) and which communication sits on each token's critical path; data-parallel replicas add throughput and failure isolation without per-token communication, while tensor, pipeline, expert, and context parallelism add capacity or reduce per-request work at the cost of synchronous communication inside a group."
    provenance: DERIVED
    domain: placement
    concepts: [parallelism_taxonomy, replica, model_parallel_group]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    assumptions: ["Replicas serve independent requests; model-parallel ranks cooperate on the same forward pass."]
    derivation: "Replicas never exchange activations for a request, so they add no per-token communication. Every model-parallel dimension splits one forward pass, so ranks must exchange partial results (all-reduce, point-to-point activations, all-to-all tokens, or KV/Q blocks) before the pass can proceed."
    limitations: ["Hybrid dimensions (for example DP attention with EP MoE) blur the replica/group boundary; state the group for each layer type."]
    applicability: "Choosing and explaining a placement plan."
    curriculum_usage: { lessons: ["20.1"], labs: ["LAB-A"], assessments: ["Mastery-20"] }
