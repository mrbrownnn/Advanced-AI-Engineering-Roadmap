  - id: CLM-024
    claim: "Across replicas, routing by prefix affinity raises cache hit rate but concentrates load when a few prefixes dominate traffic, while load-only routing balances queues but repeats prefill; a router must therefore bound affinity by load, and its quality is measured by goodput and tail latency at the offered load, not by hit rate alone."
    provenance: DERIVED
    domain: routing
    concepts: [prefix_aware_routing, load_balancing, hotspot]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    assumptions: ["Replicas hold independent prefix caches; prefix popularity is skewed."]
    derivation: "If a prefix carrying share f of traffic is pinned to one of R replicas, that replica receives at least f of load versus 1/R fair share; when f > 1/R its queue grows while others idle. Hit-rate gains reduce prefill work only for requests that are actually served within SLO."
    limitations: ["Replicating hot prefixes or a shared KV pool (CLM-016) changes the trade-off."]
    applicability: "Designing and evaluating a multi-replica router."
    curriculum_usage: { lessons: ["20.6"], labs: ["LAB-A"], assessments: ["Mastery-20", "Incident-20.1"] }
