  - id: CLM-005
    claim: "A first-order all-reduce time model is T(S, n) ≈ α + 2(n-1)/n · S / B_bus, with S the message bytes, n ranks, α a size-independent latency term, and B_bus the achieved bus bandwidth; for tensor-parallel decode S = batch_tokens × hidden × bytes is small, so per-token TP cost is often dominated by α times the number of all-reduces rather than by bandwidth."
    provenance: DERIVED
    domain: collectives
    concepts: [collective_cost, latency_bandwidth_model, decode_communication]
    confidence: medium
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["Bandwidth-optimal all-reduce (CLM-004)", "α and B_bus measured on the target topology and message size", "No overlap with compute"]
    derivation: "From CLM-004 the bandwidth term per rank is 2(n-1)/n · S / B_bus. In decode, one step carries one token per sequence, so S is batch × hidden × bytes (hundreds of KiB) and the bandwidth term is microseconds on intra-node links, comparable to or smaller than fixed latency; with two all-reduces per layer (CLM-002) the step pays 2L(α + bandwidth term)."
    limitations: ["α is not a constant across algorithms and sizes; overlap, fusion, and custom all-reduce kernels change the effective cost. Measure with nccl-tests or the runtime profiler at the real sizes."]
    applicability: "Predicting TP communication cost before profiling."
