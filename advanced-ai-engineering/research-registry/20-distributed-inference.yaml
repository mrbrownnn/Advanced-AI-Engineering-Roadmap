  - id: CLM-008
    claim: "Inference pipelines run forward passes only. A one-shot pass of m independent batches through p equal stages takes (m+p-1)·t_s, giving stage utilization m/(m+p-1). In autoregressive decode, a batch's next step cannot enter stage 1 until its previous step leaves stage p, so m circulating batches have cycle time max(Σ(t_i + x_i), m·max t_i): a single batch uses each stage at most t_s out of every p(t_s + x), per-token latency is never below the sum of stage and transfer times, and the slowest stage bounds throughput."
    provenance: DERIVED
    domain: pipeline_parallelism
    concepts: [pipeline_parallelism, pipeline_bubble, stage_imbalance, forward_only_schedule]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    assumptions: ["Stage i takes t_i per batch step and serves one batch at a time", "Each hop (including returning the sampled token to stage 1) takes x_i and does not occupy the stage", "m batches are continuously available; no backward pass exists at inference"]
    derivation: "One-shot: the last of m batches enters stage 1 at (m-1)·t_s and needs p·t_s more, while each stage is busy m·t_s, the forward-only analogue of CLM-006/CLM-007. Decode ring: one batch needs Σ(t_i + x_i) per step because of the autoregressive dependency; each stage must serve all m batches once per cycle, needing m·t_i; the cycle is the larger of the two bounds, throughput is m/cycle batch-steps, and stage i utilization is m·t_i/cycle."
    limitations: ["Runtimes may interleave prefill chunks and decode steps of different batches; measure per-stage busy time instead of assuming the equal-stage formula.", "Training schedules such as 1F1B interleave forward and backward work and do not describe inference."]
    applicability: "Deciding when PP serves capacity rather than latency, and sizing in-flight batches."
    curriculum_usage: { lessons: ["20.4"], labs: ["LAB-C"], assessments: ["Mastery-20", "Incident-20.1"] }
