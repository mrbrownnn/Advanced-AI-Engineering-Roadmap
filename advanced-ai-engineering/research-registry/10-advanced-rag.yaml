  - id: CLM-020
    claim: "Citation correctness (supported emitted citations over checked emitted citations), support completeness (support-required claims whose cited evidence entails them over support-required claims), and citation coverage (support-required claims with at least one citation marker over support-required claims) are three different ratios; correctness counts citations, the other two count claims, and all must be computed from one claim-citation table."
    provenance: DERIVED
    domain: citations
    concepts: [citation_correctness, citation_completeness, citation_coverage, zero_denominator]
    confidence: high
    currentness_status: "COURSE DEFINITION"
    assumptions: ["Claim segmentation, the support-required rule, and an entailment judgment per claim and per citation are declared.", "For a claim with several citations, the claim is supported if the concatenation of its cited passages entails it; a citation is supported if it entails the claim alone or if removing it breaks the joint support."]
    derivation: "Four claims with one citation each on C1, C2, C3 and none on C4, where only the citations of C1 and C2 entail their claims: correctness 2/3, support completeness 2/4, coverage 3/4. Counting C3 as complete would contradict counting its citation as unsupported. Second answer: C5 cites two passages that entail it only jointly (both supported), C6 cites one sufficient and one unrelated passage: correctness 3/4, completeness 2/2. Pooled: correctness 5/7 and completeness 4/6; mean of per-answer ratios: 17/24 and 3/4. With no emitted citations correctness is undefined, and with no support-required claims completeness and coverage are undefined; undefined answers are excluded from a macro average and counted."
