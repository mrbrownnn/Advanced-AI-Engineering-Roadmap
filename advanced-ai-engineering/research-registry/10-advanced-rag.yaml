  - id: CLM-021
    claim: "A progress watermark and a pinned read snapshot are different contracts: the watermark of a representation is the largest source sequence number up to which every event is decided and visible there, while a pinned snapshot is one value chosen per request at which every read of that request is served. Only the second prevents mixed-version answers, and only if it is enforced."
    provenance: DERIVED
    domain: consistency
    concepts: [high_watermark, read_snapshot, mixed_version_read, cache_key]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE / STORE-DEPENDENT ENFORCEMENT"
    assumptions: ["Representations apply events at different times.", "A request reads from more than one representation or cache."]
    derivation: "If representation watermarks are 102 and 100 and the request reads each at its current state, it can see version 2 of a document from one and version 1 from the other, although both watermarks are valid. Serving every read at one snapshot removes the mix, but a read-time filter can only drop hits newer than the snapshot; it cannot restore a version the store has overwritten, so pinning to an older snapshot needs a retained generation or point-in-time view. Without one, the consistent options are to wait, to exclude documents whose versions disagree, or to mark the answer partial. A snapshot older than a delete still returns the deleted item unless a tombstone overlay is applied at read time. Including the snapshot in a cache key prevents cross-snapshot reuse but does not replace delete overlays or validation of cached citation targets."
    limitations: ["Whether a given store offers point-in-time or generation reads was not surveyed.", "The required consistency strength is a product decision."]
    applicability: "Multi-representation retrieval with caches and replicas."
    related_claims: ["CLM-006"]
    curriculum_usage: { lessons: ["10.2"], labs: ["LAB-A"], assessments: ["Mastery-10", "Incident-10.1"] }

