  - id: CLM-018
    claim: "Retries and reordered deliveries of index updates are idempotent only when every representation applies an atomic per-document acceptance rule: accept a strictly newer source version; treat the same version with the same operation and content hash as a duplicate no-op; reject the same version with a different operation or hash as a conflict; reject an older version as stale; and record deletes as versioned tombstones retained longer than the maximum event delay and replay window."
    provenance: DERIVED
    domain: incremental_indexing
    concepts: [idempotency, conditional_write, tombstone, version_acceptance]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE / STORE-DEPENDENT ENFORCEMENT"
    assumptions: ["The source assigns each change to a document a monotonically increasing version.", "Events can be duplicated, delayed, and reordered, and more than one worker can write the same document.", "The store can compare and write in one atomic step per document, or writes for one document are serialized."]
    derivation: "With an atomic compare-and-write, applying an event twice leaves the state unchanged (duplicate) and applying an older event after a newer one leaves the newer state (stale), so the final state depends only on the set of events, not their arrival order. Traces: (v2,v1,v2) gives ACCEPT, STALE, DUPLICATE and final v2; (v2,v2,v1) gives final v2 where last-writer-wins gives v1; duplicate create gives ACCEPT, DUPLICATE, and CONFLICT for a changed hash; (upsert v3, delete v4, upsert v3) gives final tombstone v4. If the compare and the write are separate steps, two writers can both pass the comparison. If the tombstone is removed before the delayed upsert arrives, the upsert meets no record and is accepted, which resurrects the document."
    limitations: ["Depends on a trustworthy source version; wall-clock versions from workers break the ordering.", "Does not by itself make the change query-visible or consistent across representations.", "Atomicity and tombstone retention are store- and configuration-specific and must be tested.", "Durable workflow recovery and external-effect idempotency are Module 14 topics; this claim covers index writes only."]
    applicability: "Incremental RAG ingestion with at-least-once delivery."
    related_claims: ["CLM-007", "CLM-019"]
    curriculum_usage: { lessons: ["10.2"], labs: ["LAB-A"], assessments: ["Mastery-10", "Incident-10.1"] }

