  - id: CLM-015
    claim: "A hard budget is enforced by a reservation ledger: for each resource the controller keeps the limit B, committed charges C, and reserved holds R, admits an action only if C + R + q <= B for every hard resource where q is the action's worst-case charge under controller-enforced caps, performs that comparison and the addition to R atomically, and on completion moves the actual charge to C and releases q; an action whose reservation exceeds the remaining budget is rejected before dispatch."
    provenance: DERIVED
    domain: loop_control
    concepts: [budget_reservation, admission_control, reconciliation, refund, atomic_ledger]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE"
    assumptions: ["The worst-case charge of an action is bounded before dispatch by a count the controller makes or a parameter it sets.", "The ledger has a single writer or an atomic compare-and-add.", "Actual charges become known after the action, possibly late."]
    derivation: "Checking consumed < limit admits an action whose own cost crosses the limit (0.24 spent of 0.25, next call 0.07, final 0.31). With reservations the invariant C + R <= B holds by induction: admission preserves it, and reconciliation replaces q by an actual charge no larger than q. Fixture (synthetic prices 3 and 15 USD per million input and output tokens; limits 6 model calls, 8 physical tool attempts, 0.25 USD): a call with 12,000 input and a 2,000 output cap reserves 0.066 and settles at 0.0465 (refund 0.0195); three parallel searches each reserving 3 attempts give 3, 6, then 9 > 8, so the third is rejected; a 60,000-input call reserves 0.210 and 0.0765 + 0.210 = 0.2865 > 0.25, rejected, while the compacted 20,000-input call reserves 0.090 and is admitted; final state 3 calls, 5 attempts, 0.2235 USD. Without atomic admission the three branches each read zero reserved attempts and reserve 9 in total. A cancelled or timed-out action keeps its reservation until a usage record arrives and is charged in full if none does."
    limitations: ["The invariant is exact only for resources whose worst case is bounded before dispatch; cost is an estimate if the provider bills tokens that no request parameter bounds or if a tool has no per-call price cap.", "Wall-clock time cannot be reserved; a timeout bounds the wait, not the remote work or its side effects.", "An in-memory ledger does not survive a controller crash; durable storage is a Module 14 concern.", "Synthetic prices and counts."]
    applicability: "Per-episode and per-principal call, attempt, token, and cost ceilings; reused by the Module 18 cost-ceiling control."
    related_claims: ["CLM-005", "CLM-016"]
    curriculum_usage: { lessons: ["12.3"], labs: ["LAB-A"], assessments: ["Mastery-12", "Incident-12.1"] }
  - id: CLM-016
    claim: "Retries and deadlines must be accounted at the root: with k_c controller-level attempts and k_s inner client retries per attempt the worst case is k_c(1 + k_s) physical attempts, so a logical call reserves (1 + k_s) attempts or inner retries are disabled; and every child call receives a timeout of at most the root deadline minus the current time minus a reserve for verification and the final response."
    provenance: DERIVED
    domain: loop_control
    concepts: [nested_retry, deadline_propagation, remaining_deadline]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE"
    assumptions: ["Retry layers are stacked and each layer retries independently unless configured otherwise.", "The episode has one absolute deadline."]
    derivation: "Each of k_c controller attempts can trigger up to k_s inner retries, giving k_c(1 + k_s) physical attempts (3 x 3 = 9 in the fixture). Deadline fixture: 10 s root deadline, attempt 1 fails before dispatch at 2.0 s, backoff 0.5 s, attempt 2 times out after dispatch at 5.5 s with unknown effect, a 1 s postcondition query ends at 6.5 s, backoff to 7.0 s, remaining 3.0 s; with a 0.5 s reserve the third attempt gets min(5, 2.5) = 2.5 s rather than the 5 s client default. An attempt needing 4 s is cut at 9.5 s; 0.5 s is less than the 1 s query, so the episode ends escalated with unknown effect."
    limitations: ["Exercise assumptions, not measurements.", "A timeout does not cancel remote work or undo a commit."]
    applicability: "Retry policy and deadline propagation in tool-using loops."
    related_claims: ["CLM-006", "CLM-015"]
    curriculum_usage: { lessons: ["12.3"], labs: ["LAB-A", "LAB-C"], assessments: ["Mastery-12", "Incident-12.1"] }
