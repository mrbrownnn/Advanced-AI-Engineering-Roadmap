  - id: CLM-009
    claim: "For N quantized scalar weights stored at w bits each, the nominal packed payload is N*w/8 bytes; actual checkpoint and device memory additionally include scales, zero points, padding, alignment, codebooks, duplicated tensors, runtime workspaces, and allocator effects."
    provenance: DERIVED
    domain: quantization
    concepts: [weight_payload, packing_overhead, memory_accounting]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "Each of N logical weights uses exactly w payload bits and those bits are densely packed."
      - "The formula intentionally excludes all metadata and runtime allocations."
    derivation: "There are N*w payload bits. Dividing by 8 converts bits to bytes; every excluded representation or runtime object must be added separately."
    limitations:
      - "It is neither an exact checkpoint-size formula nor a latency or throughput model."
    applicability: "First-order lower-bound accounting for quantized weight payloads."
