  - id: CLM-011
    claim: "In a renewal-style speculative cycle, a useful first-order model is time per emitted token = E[T_draft(k)+T_verify(k)+T_bookkeeping]/E[A], where A is emitted tokens per cycle; this ratio requires stationary cycles with finite expectations and does not capture batching, queueing, overlap, or correlations unless those are included in the measured cycle variables."
    provenance: DERIVED
    domain: speculative_decoding
    concepts: [speculative_cycle_model, accepted_tokens, verification_cost]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    assumptions:
      - "Cycles form an ergodic renewal-reward process or a sufficiently stationary approximation."
      - "A counts all tokens committed by the target-defined acceptance procedure in a cycle."
      - "Cycle time includes drafting, verification, synchronization, and bookkeeping on the chosen observation boundary."
    derivation: "By the renewal-reward theorem, long-run emitted-token rate is E[A]/E[T_cycle]; invert it to obtain time per emitted token. Substituting measured cycle components gives the stated expression."
    limitations:
      - "E[T/A] is generally not equal to E[T]/E[A]."
      - "Acceptance rate alone omits proposal length, first-rejection position, verifier shape cost, and draft overhead."
    applicability: "Controlled analysis of speculative-decoding efficiency at a declared concurrency and scheduler configuration."
    curriculum_usage:
      lessons: ["5.5"]
      labs: ["LAB-D"]
      assessments: ["Mastery-05"]

