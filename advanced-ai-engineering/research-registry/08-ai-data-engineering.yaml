  - id: CLM-004
    claim: "Covariate shift changes P(X) while assuming P(Y|X) invariant, label shift changes P(Y) while assuming P(X|Y) invariant, and concept shift changes P(Y|X); unlabeled feature monitoring can observe that P(X) changed but cannot establish which conditional stayed invariant, so it cannot prove pure covariate shift, and a mixed shift can produce the same P(X) as a pure covariate shift."
    provenance: DERIVED
    domain: drift
    concepts: [covariate_shift, label_shift, concept_shift]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions: ["A stable definition of X, Y, population, and time window is available."]
    derivation: "P(X,Y)=P(Y|X)P(X)=P(X|Y)P(Y). Fix any target P_T(X). Pairing it with the reference P(Y|X) gives a pure covariate shift; pairing it with a different P(Y|X) gives a mixed shift. Both have identical P_T(X), so any statistic of unlabeled X has the same distribution under both. The module's toy (S vs T1 vs T2) gives identical PSI on X (0.376) while the fixed rule's error moves from 0.22 to 0.16 or to 0.37."
    limitations: ["Operational pipelines often change feature definitions simultaneously with population behavior.", "Identifiability can improve with labels, labeled canaries, or additional structural assumptions; the claim concerns unlabeled X alone."]
    applicability: "Drift hypothesis formation and telemetry design."
    curriculum_usage: { lessons: ["8.3"], labs: ["LAB-B"], assessments: ["Mastery-08", "Incident-08.1"] }
    related_claims: ["CLM-015", "CLM-016"]

  - id: CLM-005
    claim: "Population Stability Index is a binned symmetric divergence heuristic, sum_i (p_i-q_i) ln(p_i/q_i), defined only when every bin proportion is strictly positive; the zero-bin policy (pseudocount or merging), bin edges, and sample size are part of the metric, and it has no universal alert threshold or direct mapping to model-quality loss."
    provenance: DERIVED
    domain: drift_metrics
    concepts: [psi, binning, drift_threshold]
    confidence: high
    currentness_status: "LEGACY / WORKLOAD-DEPENDENT"
    assumptions: ["Reference and current proportions use identical exhaustive bins and strictly positive smoothed values."]
    derivation: "Each term (p_i-q_i) ln(p_i/q_i) is non-negative and undefined when p_i or q_i is 0. In the module's example the same counts give PSI 0.702 (pseudocount 0.5), 0.465 (pseudocount 5), or 0.221 (merged bins); model impact also depends on feature use and conditional labels."
    limitations: ["Do not interpret a conventional PSI cutoff as a statistical or product guarantee."]
    applicability: "A descriptive drift signal when binning and calibration against outcomes are documented."
    curriculum_usage: { lessons: ["8.3"], labs: ["LAB-B"], assessments: ["Mastery-08"] }

