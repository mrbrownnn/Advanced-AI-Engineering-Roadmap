    assumptions: ["Every nondeterministic or external transformation input can be captured or explicitly declared unavailable."]
    derivation: "Output data is a function of source bytes, transformation logic/configuration, execution semantics, and nondeterministic inputs; changing any argument can change the result."
    limitations: ["External APIs and mutable sources may prevent exact replay unless snapshotted."]
    applicability: "Training, evaluation, retrieval, preference, and synthetic datasets."
    curriculum_usage: { lessons: ["8.1"], labs: ["LAB-A"], assessments: ["Mastery-08"] }

