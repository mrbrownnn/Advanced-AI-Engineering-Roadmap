  - id: CLM-016
    claim: "Recovery correctness should be tested by crashing at every persistence/effect boundary and comparing final state/effects to a no-failure oracle; happy-path restart tests cannot expose all unknown-commit and duplicate-delivery windows."
    provenance: HYPOTHESIS
    domain: failure_injection
    concepts: [crash_matrix, linearization_point, recovery_oracle]
    confidence: high
    currentness_status: "CURRENT / WORKLOAD-DEPENDENT"
    hypothesis:
      prediction: "Boundary-targeted crash injection finds more duplicate, lost, stuck, or replay-incompatible outcomes than process-restart-only tests at comparable test cost."
      measurement_target: "Crash point, durable history prefix, activity attempt/effect IDs, external postconditions, duplicate/lost effects, recovery latency, stuck rate, and oracle divergence."
      falsifying_observation: "Boundary-targeted tests do not increase unique actionable failure detection or reduce escaped recovery incidents over the preregistered restart-only baseline."
    limitations: ["The crash matrix is incomplete if hidden provider or storage linearization points are unknown."]
    applicability: "Durable workflow and effect-boundary validation."
    curriculum_usage: { lessons: ["14.5"], labs: ["LAB-A", "LAB-B", "LAB-D"], assessments: ["Mastery-14"] }
