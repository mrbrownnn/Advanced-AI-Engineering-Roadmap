claims:
  - id: CLM-001
    claim: "Chain-of-thought prompting elicits intermediate text and improved accuracy on the models and arithmetic, commonsense, and symbolic tasks evaluated by Wei et al.; it does not establish that visible rationales are universally beneficial or faithful accounts of model causation."
    provenance: VERIFIED_FACT
    domain: reasoning_elicitation
    concepts: [chain_of_thought, intermediate_reasoning, task_dependence]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    evidence:
      - source_type: paper
        tier: 1
        title: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models"
        authors: "Jason Wei, Xuezhi Wang, Dale Schuurmans, Maarten Bosma, Brian Ichter, Fei Xia, Ed Chi, Quoc Le, Denny Zhou"
        year: "2022"
        url: "https://arxiv.org/abs/2201.11903"
        section: "Abstract and experiments"
        accessed_at: "2026-09"
    limitations:
      - "Effects depend on model, scale, prompt exemplars, task, decoding, and scoring."
      - "Outputting steps is an observable behavior, not proof of an internal causal trace."
    applicability: "Empirical baseline for tasks where intermediate token generation may improve answer construction."
    curriculum_usage: { lessons: ["6.1"], labs: ["LAB-A"], assessments: ["Mastery-06"] }

  - id: CLM-002
