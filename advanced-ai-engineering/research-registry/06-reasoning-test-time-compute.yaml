  - id: CLM-002
    claim: "Self-consistency samples diverse chain-of-thought paths from the decoder and selects an answer by marginalizing over the sampled reasoning paths, defined as argmax over answers a of the count of candidates whose parsed answer equals a (the paper calls this a majority vote; it is a plurality rule). The paper reports gains on evaluated reasoning benchmarks, but benefit depends on sample diversity, error correlation, answer normalization, and compute budget."
    provenance: VERIFIED_FACT
    domain: parallel_reasoning
    concepts: [self_consistency, answer_voting, sample_diversity]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    evidence:
