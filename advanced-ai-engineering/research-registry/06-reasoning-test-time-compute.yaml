    provenance: VERIFIED_FACT
    domain: parallel_reasoning
    concepts: [self_consistency, answer_voting, sample_diversity]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    evidence:
