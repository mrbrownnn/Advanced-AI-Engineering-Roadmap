  - id: CLM-015
    claim: "A useful adaptive-compute policy should allocate additional work only when its predicted marginal value exceeds its marginal cost, but difficulty and value estimates must be validated for calibration, subgroup error, and label leakage before production use."
    provenance: HYPOTHESIS
    domain: compute_allocation
    concepts: [marginal_value, adaptive_budget, difficulty_estimation]
    confidence: high
    currentness_status: "FRONTIER / WORKLOAD-DEPENDENT"
    hypothesis:
      prediction: "Compared at equal aggregate cost, a calibrated adaptive policy improves declared utility by spending less on easy/low-value cases and more on cases with positive measured return."
      measurement_target: "Per-item difficulty prediction, allocated work, candidate diversity, verifier confidence, correctness/utility, subgroup metrics, total compute, critical-path latency, and calibration on held-out time-split data."
      falsifying_observation: "At equal cost the adaptive policy fails to improve utility, concentrates error on a subgroup, or its apparent gain disappears when difficulty features with target leakage are removed."
    limitations:
      - "Marginal value can be nonstationary after model, prompt, benchmark, or verifier changes."
    applicability: "Online routing among direct answer, sequential reasoning, parallel sampling, and search."
    curriculum_usage: { lessons: ["6.5", "6.6"], labs: ["LAB-D"], assessments: ["Incident-06.1", "Mastery-06"] }

  - id: CLM-016
    claim: "A verifier-guided search can increase benchmark score while reducing real utility if the generator learns or discovers patterns that exploit verifier errors; evidence requires held-out objective checks and adversarial candidate sets rather than verifier score alone."
    provenance: HYPOTHESIS
    domain: verification
    concepts: [verifier_gaming, reward_hacking, distribution_shift]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    hypothesis:
      prediction: "As search pressure or candidate count increases, verifier score rises faster than independently checked correctness, with selected outputs exhibiting repeated exploitable features."
      measurement_target: "Verifier score, independent correctness, score-correctness calibration, candidate count/search depth, selected-vs-rejected examples, adversarial perturbations, and temporal/out-of-domain holdouts."
      falsifying_observation: "Verifier calibration and independently checked utility remain stable across increased search pressure and adversarial candidate sets."
    limitations:
      - "A widening score-quality gap can also arise from evaluator noise or distribution shift without deliberate exploitation."
    applicability: "Best-of-N, process-reward search, tree search, and iterative critique systems."
    curriculum_usage: { lessons: ["6.4", "6.6"], labs: ["LAB-C"], assessments: ["Incident-06.1", "Mastery-06"] }
