  - id: CLM-009
    claim: "If k candidate correctness events are independent Bernoulli trials with identical success probability p, oracle pass@k is 1-(1-p)^k; correlated or non-identically distributed candidates invalidate this formula."
    provenance: DERIVED
    domain: reasoning_metrics
    concepts: [pass_at_k, independence_assumption, oracle_success]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "Each candidate is judged against an objective ground truth."
      - "Correctness events are independent with common probability p. For repeated sampling this means one fixed item and k draws generated independently under one sampling contract (separate random streams, no shared seed, cache reuse, deduplication, or conditioning on earlier candidates)."
      - "Oracle pass@k asks whether any candidate is correct, not whether a deployable selector chooses it."
    derivation: "The probability all k candidates fail is (1-p)^k; the complementary event that at least one succeeds has probability 1-(1-p)^k."
    limitations:
      - "Pooled over items of unequal difficulty, candidates for the same item are positively correlated even when each item's draws are independent, and the pooled formula overstates population pass@k (see CLM-017)."
      - "Greedy decoding, beam candidates, shared seeds, or revisions conditioned on earlier candidates make the draws themselves dependent."
      - "It does not include verifier error, cost, latency, or answer selection."
    applicability: "Toy planning and independence-sensitivity analysis for repeated sampling."
    curriculum_usage: { lessons: ["6.2"], labs: ["LAB-B"], assessments: ["Mastery-06"] }

  - id: CLM-010
    claim: "Given n sampled completions with c correct and k<=n, 1-C(n-c,k)/C(n,k) is the probability that a uniformly selected size-k subset contains at least one of those c correct completions; it is the finite-sample pass@k estimator used in code-generation evaluation, not a majority-vote metric."
    provenance: DERIVED
    domain: reasoning_metrics
    concepts: [pass_at_k_estimator, finite_sample, without_replacement]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "Exactly c of the n observed samples pass a deterministic correctness test."
      - "A size-k subset is selected uniformly without replacement."
    derivation: "There are C(n,k) size-k subsets and C(n-c,k) all-failure subsets; subtract their ratio from one."
    evidence:
      - source_type: paper
        tier: 1
        title: "Evaluating Large Language Models Trained on Code"
        authors: "Mark Chen et al."
        year: "2021"
        url: "https://arxiv.org/abs/2107.03374"
        version: "arXiv v2 (14 Jul 2021)"
        section: "Section 2.1 (Eq. 1, Figure 3); Appendix A"
        accessed_at: "2026-10"
    limitations:
      - "Requires an executable or otherwise objective candidate-level judge."
      - "Unbiasedness for the per-problem quantity 1-(1-p)^k assumes the n samples are independent draws with common p for that problem (see CLM-018)."
      - "Does not measure selection accuracy or user-visible utility."
    applicability: "Offline evaluation when multiple candidates per problem are generated and objectively checked."
    curriculum_usage: { lessons: ["6.2"], labs: ["LAB-B"], assessments: ["Mastery-06"] }

  - id: CLM-011
    claim: "For odd k independent binary votes each correct with probability p, strict-majority correctness is sum from j=(k+1)/2 to k of C(k,j)p^j(1-p)^(k-j); real self-consistency often violates independence and uses multi-class plurality after answer normalization."
    provenance: DERIVED
    domain: reasoning_metrics
    concepts: [majority_vote, binomial_model, error_correlation]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "k is odd, votes are independent, and each has identical correctness probability p."
      - "Correctness is binary and the selector requires a strict majority of correct votes."
    derivation: "The count of correct votes is Binomial(k,p); sum its probability mass above k/2."
    limitations:
      - "Plurality can select the correct answer without a majority when wrong answers split, or select a correlated wrong answer."
      - "The equation does not model parsing, abstention, ties, or verifier selection."
    applicability: "Analytical baseline for how diversity/correlation changes voting expectations."
    curriculum_usage: { lessons: ["6.2"], labs: ["LAB-B"], assessments: ["Mastery-06"] }

  - id: CLM-012
    claim: "A complete test-time compute ledger sums generator, verifier, tool, and orchestration work across all candidates, while wall-clock latency depends on parallelism and critical path; candidate count or output tokens alone are incomplete cost measures."
    provenance: DERIVED
    domain: compute_accounting
    concepts: [compute_ledger, critical_path, total_tokens, verifier_cost]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "All terms are converted to one declared unit such as GPU-seconds, accelerator FLOPs, tokens by model class, or monetary cost."
      - "The timing boundary and parallel execution resources are explicitly recorded."
    derivation: "Total resource use is additive over executed work after unit conversion; elapsed time follows the dependency critical path and can be smaller than summed work when branches run in parallel. Synthetic check: four branches of 2.0, 2.4, 3.1, 2.7 s plus a 0.5 s verifier pass after the join and 0.1 s host orchestration give 10.7 accelerator-seconds of work; the critical path is 3.1+0.1+0.5=3.7 s with four free workers and max(2.0+3.1, 2.4+2.7)+0.6=5.7 s with two workers, with total work unchanged."
    limitations:
      - "Token counts are not compute-equivalent across models, sequence positions, batch shapes, or verifier types."
      - "FLOPs estimates omit memory, communication, idle capacity, and billing rules."
      - "The worked numbers are synthetic and assume no queueing and no slowdown from sharing a device."
      - "Token count is a work measure, not a quality measure."
    applicability: "Cost/latency comparison of sequential reasoning, best-of-N, voting, and tree search."
    curriculum_usage: { lessons: ["6.5"], labs: ["LAB-B", "LAB-C", "LAB-D"], assessments: ["Mastery-06"] }

  - id: CLM-013
    claim: "Oracle best-of-N uses ground truth to ask whether any candidate is correct; a deployable verifier-selected best-of-N can be worse because selection has false-positive and false-negative errors, so oracle pass@N is an upper bound only under a candidate set and correctness definition."
    provenance: DERIVED
    domain: verification
    concepts: [oracle_best_of_n, verifier_selection, selection_gap]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "The oracle and verifier operate on the same generated candidate set."
      - "Ground-truth correctness is well-defined for the oracle comparison."
    derivation: "The oracle succeeds whenever at least one candidate is correct. A fallible selector can choose a wrong candidate from a set containing a correct one but cannot create a correct candidate absent from the set; therefore realized selection success cannot exceed oracle set success under these boundaries."
    limitations:
      - "If the verifier changes generation/search, the candidate sets differ and the simple bound comparison no longer isolates selection."
      - "Candidate-level precision and recall do not determine item-level selected success."
      - "Synthetic check used in Lesson 6.4: 60 of 100 fixed sets contain a correct candidate and 45 selections are correct, giving 0.60 oracle, 0.45 selected, 0.75 selection accuracy given opportunity."
    applicability: "Separating generator diversity from verifier quality in repeated-sampling experiments."
    curriculum_usage: { lessons: ["6.4"], labs: ["LAB-B", "LAB-C"], assessments: ["Mastery-06"] }

