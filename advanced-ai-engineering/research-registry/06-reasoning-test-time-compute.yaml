  - id: CLM-017
    claim: "When each item i has its own single-sample correctness probability p_i and candidates are independent draws within an item, population pass@k equals the average over items of 1-(1-p_i)^k, which is at most 1-(1-pbar)^k for the pooled mean pbar, with equality for k>=2 only when all p_i are equal. Candidates for the same randomly chosen item are then positively correlated with correlation Var(p_i)/(pbar(1-pbar)). If the draws are fully dependent (identical candidates, as under greedy decoding), pass@k equals pass@1."
    provenance: DERIVED
    domain: reasoning_metrics
    concepts: [pass_at_k, item_heterogeneity, correlated_candidates, independence_assumption]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "Correctness is binary and judged against ground truth."
      - "Within an item, the k candidates are independent draws with common probability p_i; items are sampled from a fixed population."
      - "For the greedy statement: exact arithmetic and a deterministic decoder, so all k candidates are identical."
    derivation: "(1-p)^k is convex in p for k>=2, so by Jensen E[(1-p_i)^k] >= (1-pbar)^k and therefore E[1-(1-p_i)^k] <= 1-(1-pbar)^k. For two candidates of one random item, P(both correct)=E[p_i^2], so the covariance is E[p_i^2]-pbar^2=Var(p_i). Synthetic checks: with half the items at p_i=0.8 and half at 0, pbar=0.4, population pass@3=0.5*(1-0.2^3)=0.496 versus 0.784 pooled, and correlation (0.32-0.16)/0.24=0.667. For the four-item table of Lesson 6.2 (correct counts 4,2,2,0 of n=5): single-sample accuracy 0.40, finite-sample pass@3 (1+0.9+0.9+0)/4=0.70, per-item plug-in mean 0.64, plurality-selected accuracy 0.50, strict-majority rate 0.25, oracle set success over five candidates 0.75. All values recomputed in Python."
    limitations:
      - "The table and the mixture are synthetic exercise data, not benchmark results."
      - "Does not model partially dependent draws such as low-temperature near-duplicates; those need measurement."
