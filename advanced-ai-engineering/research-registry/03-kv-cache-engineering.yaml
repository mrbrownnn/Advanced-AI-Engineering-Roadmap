  - id: "M03-CLM-011"
    claim: "For a payload of Q bytes crossing a link with measured effective bandwidth beta bytes/s, Q/beta is an ideal serialization-time lower bound; real offload or KV-transfer latency also includes setup, contention, synchronization, layout conversion, and any non-overlapped critical-path work."
    provenance: "DERIVED"
    domain: "tiering"
    concepts: ["offload", "kv_transfer", "bandwidth_bound", "latency_bound"]
    confidence: "high"
    assumptions:
      - "Payload Q and bandwidth beta use compatible byte units and the same transfer path."
      - "The payload is sent once with no compression, retransmission, or duplex contention."
      - "beta is a measured effective rate for a representative transfer size."
    derivation: "Serialization time equals transferred bytes divided by effective bytes per second. Additional terms can only increase non-overlapped completion time unless hidden by overlap."
    limitations:
      - "It is not an end-to-end TTFT or TPOT model and does not prove whether transfer is on the critical path."
    applicability: "Screening host offload and disaggregated-transfer feasibility."
    curriculum_usage:
      lessons: ["3.9"]
      labs: ["LAB-D"]
      assessments: ["Mastery-03"]

