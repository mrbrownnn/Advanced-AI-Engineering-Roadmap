  - id: "M03-CLM-007"
    claim: "In the pinned vLLM BlockPool, cached blocks whose reference count reaches zero enter the free queue as eviction candidates; a later cache hit removes such a block from that queue and increments its reference count, while allocation can evict cached metadata before reuse."
    provenance: "VERIFIED_FACT"
    domain: "runtime_implementation"
    concepts: ["reference_count", "eviction_candidate", "free_queue", "prefix_cache_lifecycle"]
    confidence: "high"
    evidence:
      - source_type: "source_code"
        tier: 1
        title: "vLLM V1 BlockPool"
        repository: "https://github.com/vllm-project/vllm"
        commit: "25b0add7b8a1c944d5c4e364f2de6aa82497a2ad"
        verification_date: "2026-09-25"
        file: "vllm/v1/core/block_pool.py"
        symbol: "BlockPool.get_new_blocks; BlockPool.touch; BlockPool.free_blocks; BlockPool._maybe_evict_cached_block"
        url: "https://github.com/vllm-project/vllm/blob/25b0add7b8a1c944d5c4e364f2de6aa82497a2ad/vllm/v1/core/block_pool.py"
        accessed_at: "2026-09-25"
    limitations:
