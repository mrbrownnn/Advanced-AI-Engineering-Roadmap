module: "03-kv-cache-engineering"
registry_version: "1.0.0"
research_cutoff: "2026-09-25"
change_reason: "Evidence registry for KV state sizing, block allocation, sharing, prefix reuse, eviction, compression, tiering, and a pinned current vLLM V1 trace."

out_of_scope_candidates:
  - "GPU execution and Roofline profiling (Module 02)"
  - "Request scheduling objectives, queueing, admission, and capacity planning (Module 04)"
  - "General quantization and attention-kernel optimization (Module 05)"
  - "Distributed prefill/decode placement and transport specialization (Module 20)"

claims:
  - id: "M03-CLM-001"
    claim: "During autoregressive self-attention, caching previously computed keys and values avoids recomputing those K/V projections for the retained prefix, while the new query still attends to retained state and cache storage grows with retained positions."
    provenance: "VERIFIED_FACT"
    domain: "kv_semantics"
    concepts: ["autoregressive_decode", "kv_reuse", "retained_prefix"]
    confidence: "high"
    evidence:
      - source_type: "official_docs"
        tier: 2
        title: "Multi-Head, Multi-Query, and Group-Query Attention"
        authors: "NVIDIA TensorRT-LLM"
        url: "https://nvidia.github.io/TensorRT-LLM/advanced/gpt-attention.html"
        section: "KV Cache"
        accessed_at: "2026-09-25"
    limitations:
      - "Sliding-window, sparse, recurrent/state-space, latent-attention, cross-attention, and hybrid models have different retained state and byte formulas."
      - "Caching reduces recomputation but does not make attention over a growing retained context free."
    applicability: "Decoder KV lifecycle and memory accounting."
    curriculum_usage:
      lessons: ["3.1"]
      labs: ["LAB-A"]
      assessments: ["Mastery-03"]

  - id: "M03-CLM-002"
    claim: "For uncompressed decoder self-attention with L cached layers, H_kv key/value heads, head width d_h, and b bytes per stored scalar, the logical KV payload per retained token is 2*L*H_kv*d_h*b bytes before sharding, alignment, metadata, and architecture-specific state."
    provenance: "DERIVED"
    domain: "memory_accounting"
    concepts: ["bytes_per_token", "mha", "mqa", "gqa"]
    confidence: "high"
    assumptions:
      - "Each cached layer stores one K and one V vector for every retained token and KV head."
      - "K and V use the same head count, head width, and storage dtype."
      - "No quantization metadata, padding, allocator rounding, replication, sharding, latent compression, sliding-window eviction, or non-attention state is included."
    derivation: "Each token stores L*H_kv*d_h scalars for K and the same for V. Multiply their sum by b bytes per scalar."
    limitations:
      - "It is a logical payload component, not process VRAM or an exact capacity limit."
    applicability: "MHA/MQA/GQA payload estimates and workload sizing."
    curriculum_usage:
      lessons: ["3.1"]
      labs: ["LAB-A"]
      assessments: ["Mastery-03"]

  - id: "M03-CLM-003"
    claim: "PagedAttention introduced block-granular logical-to-physical KV mapping so a sequence can grow using non-contiguous physical blocks; the paper also describes block sharing and copy-on-write for compatible sampling workloads."
    provenance: "VERIFIED_FACT"
    domain: "paged_allocation"
    concepts: ["paged_attention", "block_table", "non_contiguous_storage", "copy_on_write"]
    confidence: "high"
    evidence:
      - source_type: "paper"
        tier: 1
        title: "Efficient Memory Management for Large Language Model Serving with PagedAttention"
        authors: "Woosuk Kwon, Zhuohan Li, Siyuan Zhuang, Ying Sheng, Lianmin Zheng, Cody Hao Yu, Joseph E. Gonzalez, Hao Zhang, Ion Stoica"
        year: "2023"
        url: "https://doi.org/10.1145/3600006.3613165"
        section: "Sections 3 and 4"
        accessed_at: "2026-09-25"
    limitations:
      - "The paper's throughput numbers and original runtime organization are not current universal behavior."
      - "Paged KV does not eliminate tail slack, metadata, physical-pool sizing, or lower-level allocator fragmentation."
    applicability: "Reference mechanism for block tables, growth, sharing, and allocation waste."
    curriculum_usage:
      lessons: ["3.2", "3.3", "3.4"]
      labs: ["LAB-A", "LAB-B"]
      assessments: ["Mastery-03"]

  - id: "M03-CLM-004"
    claim: "In a simple fixed-size per-sequence block allocation with block size B tokens and sequence length S>0, allocated capacity is B*ceil(S/B) and tail slack is B*ceil(S/B)-S, which is between 0 and B-1 tokens."
    provenance: "DERIVED"
    domain: "fragmentation"
    concepts: ["internal_fragmentation", "tail_slack", "block_size"]
    confidence: "high"
    assumptions:
      - "Every logical block has capacity B tokens and only the final block can be partially filled."
      - "No cross-request packing within a physical block, hybrid cache groups, alignment expansion, or speculative lookahead is counted."
    derivation: "ceil(S/B) blocks are necessary; subtract useful S tokens from their B*ceil(S/B) slots. Euclidean division bounds the remainder waste by B-1."
    limitations:
      - "This does not quantify external fragmentation or total runtime memory waste."
    applicability: "Block-size trade-offs and simulator invariants."
    curriculum_usage:
      lessons: ["3.2", "3.3"]
      labs: ["LAB-A", "LAB-B"]
      assessments: ["Mastery-03"]

