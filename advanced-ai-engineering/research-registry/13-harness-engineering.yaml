  - id: CLM-017
    claim: "Provider conformance probes over canonical fixtures, stream chunking, schema features, errors, and usage will detect adapter drift earlier than production outcome metrics alone."
    provenance: HYPOTHESIS
    domain: portability
    concepts: [conformance_suite, adapter_drift, contract_test]
    confidence: high
    currentness_status: "CURRENT / WORKLOAD-DEPENDENT"
    hypothesis:
      prediction: "A versioned conformance suite detects incompatible provider/model/adapter changes before or during canary with lower user-impacting failure than end-outcome monitoring alone."
      measurement_target: "Fixture pass rate by capability, raw-versus-normalized deltas, stream assembly, schema coverage, error classification, usage reconciliation, canary failures, and time to detection."
      falsifying_observation: "The suite adds no earlier detection or reduction in user-impacting regressions over a preregistered outcome-only baseline within uncertainty."
    limitations: ["Fixtures can miss emergent behavioral drift and may themselves encode stale assumptions."]
    applicability: "Adapter, model, endpoint, and provider upgrades."
    curriculum_usage: { lessons: ["13.2", "13.6"], labs: ["LAB-A", "LAB-D"], assessments: ["Incident-13.1"] }
