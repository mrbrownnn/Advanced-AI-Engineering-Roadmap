  - id: CLM-021
    claim: "A byte string of n bytes has 2^(n-1) partitions into contiguous non-empty chunks, so chunk-boundary invariance of a stream decoder can be tested exhaustively only for small fixtures; larger inputs need generated families (all single cuts, bounded multi-cuts, one byte per chunk) plus seeded sampling, and a pass on a sampled set is not a proof."
    provenance: DERIVED
    domain: streaming
    concepts: [chunk_invariance, exhaustive_test, sampled_test]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE (module derivation; adoption not measured)"
    assumptions: ["Transport reads may end at any byte offset.", "The decoder is deterministic given the byte sequence and its chunking."]
    derivation: "Each of the n-1 gaps between adjacent bytes is either a cut or not, giving 2^(n-1) partitions. For n=12 this is 2,048, which is enumerable; for n=580 it is 2^579, which is not. Single cuts number n-1 and double cuts C(n-1,2), which stay enumerable for moderate n."
    limitations: ["Covers byte chunking only; how a provider cuts arguments into deltas is a separate invariance on the event sequence.", "Timing-dependent defects such as backpressure are not covered by partition enumeration."]
    applicability: "Designing and reporting stream-assembly tests."
    curriculum_usage: { lessons: ["13.4"], labs: ["LAB-C"], assessments: ["Mastery-13"] }
  - id: CLM-022
    claim: "A JSON document carried as the value of a JSON string must be decoded one layer before it is parsed and validated; and the stage at which a constraint first rejects a candidate depends on where that constraint is declared, while caller authority cannot be expressed in a static schema because it depends on the caller."
    provenance: DERIVED
    domain: output_validation
    concepts: [encoding_layer, first_failing_stage, validation_ladder]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE (module derivation; adoption not measured)"
    assumptions: ["The envelope and the embedded document are both JSON texts.", "Schema validation is static with respect to the caller."]
    derivation: "Inside a JSON string the quotation mark is written as a backslash escape, so the escaped text is not itself a JSON document and a standard parser rejects it; parsing the envelope yields a string, and parsing that string yields the object. A numeric bound written in the schema is evaluated at the schema stage, the same bound written in application code at the invariant stage. A permission set varies per caller and so is not a property of the schema."
    limitations: ["Synthetic fixture; says nothing about how often models emit such documents.", "Some systems inject caller-specific constraints into a per-request schema, which moves part of the authority check earlier but does not remove the need to authorize."]
    applicability: "Tool-call argument handling and structured-output validation."
