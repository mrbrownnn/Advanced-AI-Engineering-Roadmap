    domain: request_contract
    concepts: [request_manifest, versioning, canonicalization]
    confidence: high
    currentness_status: "RECOMMENDED BASELINE (module derivation; adoption not measured)"
    assumptions: ["The harness can record configuration without persisting prohibited sensitive content."]
    derivation: "Without the effective request inputs and transformation versions, two calls cannot be compared, replayed, attributed, or audited when behavior changes."
    limitations: ["Provider-hidden preprocessing and model revisions may remain unavailable; privacy policy may require hashes or redaction."]
    applicability: "Model request construction and provenance."
    curriculum_usage: { lessons: ["13.1", "13.6"], labs: ["LAB-A", "LAB-D"], assessments: ["Incident-13.1"] }
