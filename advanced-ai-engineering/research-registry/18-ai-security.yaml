    curriculum_usage: { lessons: ["18.6"], labs: ["LAB-C"], assessments: ["Production-Source-Trace"] }
  - id: CLM-015
    claim: "Removing either untrusted-content ingestion, access to sensitive data, or an exfiltration-capable sink from an agent's reachable graph will eliminate a larger share of successful injection-driven exfiltration than adding another detector layer, at comparable utility cost."
    provenance: HYPOTHESIS
    domain: architecture_tradeoff
    concepts: [attack_path_elimination, source_sink_graph, detector_layer]
    confidence: medium
    currentness_status: "WORKLOAD-DEPENDENT"
    hypothesis:
      prediction: "On an AgentDojo-style suite with adaptive attacks, cutting one leg of the source–data–sink path lowers exfiltration success more than adding a detector, for a matched utility drop."
      measurement_target: "Targeted attack success under adaptive attack, benign utility, utility under attack, and latency/cost."
      falsifying_observation: "An added detector achieves equal or lower adaptive attack success with smaller utility loss than any path cut."
    limitations: ["Some products require all three legs; then per-action authorization and approvals are the remaining controls."]
    applicability: "Agent architecture decisions."
    curriculum_usage: { lessons: ["18.4", "18.6"], labs: ["LAB-D"], assessments: ["Mastery-18"] }
