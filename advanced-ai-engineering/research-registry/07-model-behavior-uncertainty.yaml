  - id: CLM-016
    claim: "Split conformal prediction takes the ceil((n+1)(1-alpha))/n empirical quantile of n calibration nonconformity scores; if calibration and test points are exchangeable, the test score is at most that quantile with probability at least 1-alpha, marginally over calibration and test draws, and an upper bound of 1-alpha+1/(n+1) additionally requires tie-free scores or randomized tie-breaking."
    provenance: VERIFIED_FACT
    domain: conformal_prediction
    concepts: [split_conformal, finite_sample_quantile, exchangeability, marginal_coverage]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    evidence:
      - source_type: paper
        tier: 1
        title: "A Gentle Introduction to Conformal Prediction and Distribution-Free Uncertainty Quantification"
        authors: "Anastasios N. Angelopoulos, Stephen Bates"
        year: "2022"
        version: "arXiv v6 (2022-12-07)"
        url: "https://arxiv.org/abs/2107.07511"
        section: "Section 1.1 quantile rule and Theorem 1; Equation (1) upper bound; tie-breaking footnote; proof in Appendix D"
        accessed_at: "2026-09-30"
    limitations:
      - "The guarantee is marginal, not conditional on the input, subgroup, or calibration set actually drawn."
      - "When ceil((n+1)(1-alpha)) > n the quantile is set to infinity; that convention is a derivation used in the module, not a quoted statement from the source."
    applicability: "Any split-conformal construction whose covered event can be written as r_test <= q_hat."
    curriculum_usage: { lessons: ["7.5"], labs: ["LAB-D"], assessments: ["Mastery-07"] }
    related_claims: ["CLM-012", "CLM-017"]

  - id: CLM-017
    claim: "The module's conformal claim filter defines r_i as the highest score among false claims of calibration output i (negative infinity if none), sets q_hat to the k-th smallest r_i with k=ceil((n+1)(1-alpha)) (positive infinity if k>n), and keeps exactly the test claims with score strictly greater than q_hat; because 'all kept claims are true' is equivalent to r_test <= q_hat, split-conformal exchangeability gives P(all kept claims true) >= 1-alpha, including when scores tie."
    provenance: DERIVED
    domain: conformal_prediction
    concepts: [conformal_claim_filter, nonconformity_score, tie_handling, abstention]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    assumptions:
      - "Calibration and test outputs are exchangeable and the decomposer, scorer, and label guide are frozen before calibration."
      - "Every claim receives a binary true/false label under the frozen guide, and the covered event is per-claim truth of every kept claim."
      - "An empty kept set is replaced by abstention or escalation, which counts as covered but is not useful."
    derivation: "Some kept claim is false iff a false claim has score > q_hat iff r_test > q_hat. Hence the covered event equals r_test <= q_hat, and CLM-016 applies with r as the nonconformity score. The strict inequality makes the equivalence exact when a test score equals q_hat. The lower bound needs no tie-free assumption; the upper bound is not claimed."
    limitations:
      - "It corresponds to Mohri and Hashimoto's event only when entailment of the kept set reduces to per-claim truth; it is not a reproduction of their implementation."
      - "Label error changes the covered event; the guarantee is about labels, not ground truth."
      - "A synthetic simulation (seed 7, 20,000 trials) supports but does not prove the derivation, and no real-model coverage is reported."
    applicability: "Long-form answers that can be decomposed into independently labeled claims and safely shortened or abstained."
    curriculum_usage: { lessons: ["7.5"], labs: ["LAB-D"], assessments: ["Mastery-07"] }
    related_claims: ["CLM-012", "CLM-016"]

