    applicability: "Candidate self-evaluation signals whose correctness discrimination and calibration are separately measured."
    curriculum_usage: { lessons: ["7.2", "7.3"], labs: ["LAB-B", "LAB-C"], assessments: ["Mastery-07"] }

  - id: CLM-008
    claim: "TruthfulQA measures whether answers reproduce selected human falsehoods and misconceptions across its authored question set; performance on it is one behavioral slice and not a complete hallucination, factuality, or safety measure."
    provenance: VERIFIED_FACT
    domain: behavior_benchmarks
    concepts: [truthfulness, imitative_falsehood, benchmark_scope]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    evidence:
      - source_type: paper
        tier: 1
        title: "TruthfulQA: Measuring How Models Mimic Human Falsehoods"
        authors: "Stephanie Lin, Jacob Hilton, Owain Evans"
        year: "2022"
        url: "https://arxiv.org/abs/2109.07958"
        section: "Dataset construction, metrics, and limitations"
        accessed_at: "2026-09"
    limitations:
      - "A fixed benchmark can become contaminated, stale, or unrepresentative of deployment."
      - "Truthfulness and informativeness are distinct scoring dimensions."
    applicability: "Regression slice for misconception-sensitive QA when paired with deployment-specific tests."
    curriculum_usage: { lessons: ["7.1", "7.6"], labs: ["LAB-A", "LAB-D"], assessments: ["Mastery-07"] }

  - id: CLM-009
    claim: "FActScore decomposes long-form generations into atomic facts and measures the fraction supported by a knowledge source; automated estimates inherit decomposition, retrieval, source-quality, entailment, and temporal-validity errors."
    provenance: VERIFIED_FACT
    domain: factuality_measurement
    concepts: [atomic_facts, factual_precision, evidence_support]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    evidence:
      - source_type: paper
        tier: 1
        title: "FActScore: Fine-grained Atomic Evaluation of Factual Precision in Long Form Text Generation"
        authors: "Sewon Min, Kalpesh Krishna, Xinxi Lyu, Mike Lewis, Wen-tau Yih, Pang Wei Koh, Mohit Iyyer, Luke Zettlemoyer, Hannaneh Hajishirzi"
        year: "2023"
        url: "https://arxiv.org/abs/2305.14251"
        section: "Metric definition and automated estimator"
        accessed_at: "2026-09"
    limitations:
      - "Precision over expressed facts does not measure omitted required facts, usefulness, reasoning validity, or all harms."
    applicability: "Long-form factual precision where evidence sources and atomic claims can be audited."
    curriculum_usage: { lessons: ["7.1", "7.4"], labs: ["LAB-A"], assessments: ["Mastery-07"] }

  - id: CLM-010
