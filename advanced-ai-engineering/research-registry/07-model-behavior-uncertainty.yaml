  - id: CLM-012
    claim: "Conformal factuality (Mohri and Hashimoto) splits an LM output into sub-claims, backs off by removing sub-claims whose score falls below a threshold calibrated at the ceil((n+1)(1-alpha))/n empirical quantile of per-example minimal safe thresholds, and states (Theorem 4.1) that under exchangeability and alpha in [1/(n+1),1] the reference entails the backed-off output with probability at least 1-alpha; the guarantee is marginal and does not imply per-prompt correctness, semantic completeness, subgroup coverage, or validity after uncontrolled shift."
    provenance: VERIFIED_FACT
    domain: conformal_prediction
    concepts: [conformal_factuality, marginal_coverage, exchangeability]
    confidence: high
    currentness_status: "FRONTIER / WORKLOAD-DEPENDENT"
    evidence:
      - source_type: paper
        tier: 1
        title: "Language Models with Conformal Factuality Guarantees"
        authors: "Christopher Mohri, Tatsunori Hashimoto"
        year: "2024"
        url: "https://arxiv.org/abs/2402.10978"
        version: "arXiv v1 (2024-02-15)"
        section: "Section 3 (entailment sets and conformal setup), Algorithm 1, Section 4 Theorem 4.1, Section 5 Assumption 5.1 (arXiv HTML rendering)"
        accessed_at: "2026-09-30"
    limitations:
