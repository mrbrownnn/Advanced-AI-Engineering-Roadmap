        entry_point: "GenerationMixin.generate(...) with return_dict_in_generate/output_scores/output_logits"
        execution_path: "generate -> decode loop records scores/logits -> output object; compute_transition_scores -> stack/gather selected-token scores -> optional log_softmax"
        url: "https://github.com/huggingface/transformers/blob/27166ea03f12c940f23176a904ab1d2ff1a3dcbb/src/transformers/generation/utils.py"
        accessed_at: "2026-09"
    limitations:
