    applicability: "Black-box uncertainty signal when model internals or token probabilities are unavailable."
    curriculum_usage: { lessons: ["7.4"], labs: ["LAB-C"], assessments: ["Mastery-07"] }

  - id: CLM-011
    claim: "Semantic entropy clusters sampled answers by meaning before measuring uncertainty and is reported as more predictive of model accuracy than compared baselines on the paper's evaluated QA datasets; its result depends on sampling and semantic-equivalence judgments and is not a universal hallucination detector."
    provenance: VERIFIED_FACT
    domain: semantic_uncertainty
    concepts: [semantic_entropy, meaning_clusters, confabulation_detection]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    evidence:
      - source_type: paper
        tier: 1
        title: "Semantic Uncertainty: Linguistic Invariances for Uncertainty Estimation in Natural Language Generation"
        authors: "Lorenz Kuhn, Yarin Gal, Sebastian Farquhar"
        year: "2023"
        url: "https://arxiv.org/abs/2302.09664"
        section: "Semantic entropy method and QA experiments"
        accessed_at: "2026-09"
    limitations:
      - "Entailment or clustering errors can merge contradictory meanings or split paraphrases."
      - "Multiple samples add cost; low entropy can still represent a stable false belief."
    applicability: "Free-form QA uncertainty where semantic equivalence is more appropriate than surface-string variation."
    curriculum_usage: { lessons: ["7.4"], labs: ["LAB-C"], assessments: ["Mastery-07"] }

  - id: CLM-012
    claim: "Conformal factuality provides finite-sample marginal guarantees for its defined entailment-set correctness under exchangeability and a fixed calibration procedure; the guarantee does not imply per-prompt correctness, semantic completeness, subgroup coverage, or validity after uncontrolled shift."
    provenance: VERIFIED_FACT
    domain: conformal_prediction
    concepts: [conformal_factuality, marginal_coverage, exchangeability]
    confidence: high
    currentness_status: "FRONTIER / WORKLOAD-DEPENDENT"
    evidence:
      - source_type: paper
        tier: 1
        title: "Language Models with Conformal Factuality Guarantees"
        authors: "Christopher Mohri, Tatsunori Hashimoto"
        year: "2024"
        url: "https://arxiv.org/abs/2402.10978"
        section: "Conformal factuality framework, guarantees, and experiments"
        accessed_at: "2026-09"
    limitations:
      - "Guarantee semantics inherit the entailment relation, back-off construction, annotations, and exchangeability assumptions."
    applicability: "Systems able to return less-specific answers or sets and maintain a representative calibration stream."
    curriculum_usage: { lessons: ["7.5"], labs: ["LAB-D"], assessments: ["Mastery-07"] }

  - id: CLM-013
    claim: "Kalai and Vempala prove a hallucination lower bound for a specified class of arbitrary facts under their generative calibration assumptions; it does not prove that all factual errors are unavoidable or that calibration causes every practical hallucination."
    provenance: VERIFIED_FACT
    domain: hallucination_theory
    concepts: [calibration_lower_bound, arbitrary_facts, good_turing]
    confidence: high
    currentness_status: "FRONTIER / THEORETICAL"
    evidence:
      - source_type: paper
        tier: 1
        title: "Calibrated Language Models Must Hallucinate"
        authors: "Adam Tauman Kalai, Santosh S. Vempala"
        year: "2024"
        url: "https://arxiv.org/abs/2311.14648"
        section: "Definitions, lower-bound theorem, and scope discussion"
        accessed_at: "2026-09"
    limitations:
      - "The theorem's arbitrary-fact and calibration definitions must not be silently extended to systematic facts, retrieved evidence, post-training, or tool-grounded systems."
    applicability: "Teaching why one theoretical result cannot substitute for an operational failure taxonomy and measurement."
    curriculum_usage: { lessons: ["7.1"], labs: ["LAB-A"], assessments: ["Mastery-07"] }

  - id: CLM-014
    claim: "At Transformers commit 27166ea03f12c940f23176a904ab1d2ff1a3dcbb, generation outputs can expose processed scores and raw logits, and GenerationMixin.compute_transition_scores optionally applies log_softmax to reconstruct selected-token transition scores; these values describe generation likelihood under that path, not calibrated answer correctness."
    provenance: VERIFIED_FACT
    domain: runtime_implementation
    concepts: [generation_scores, transition_scores, correctness_confidence]
    confidence: high
    currentness_status: "CURRENT TRANSFORMERS SNAPSHOT"
    evidence:
      - source_type: source_code
        tier: 1
        title: "Transformers generation output and transition-score implementation"
        repository: "https://github.com/huggingface/transformers"
        commit: "27166ea03f12c940f23176a904ab1d2ff1a3dcbb"
        verification_date: "2026-09-26"
