    provenance: VERIFIED_FACT
    domain: black_box_uncertainty
    concepts: [self_consistency_signal, sample_disagreement, hallucination_detection]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    evidence:
      - source_type: paper
        tier: 1
        title: "SelfCheckGPT: Zero-Resource Black-Box Hallucination Detection for Generative Large Language Models"
        authors: "Potsawee Manakul, Adian Liusie, Mark J. F. Gales"
        year: "2023"
        url: "https://arxiv.org/abs/2303.08896"
        section: "Method and passage-level experiments"
        accessed_at: "2026-09"
    limitations:
