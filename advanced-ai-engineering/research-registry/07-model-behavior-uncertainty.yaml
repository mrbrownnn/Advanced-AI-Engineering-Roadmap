module: "07-model-behavior-uncertainty"
registry_version: "1.0.0"
research_cutoff: "2026-09-26"
change_reason: "Replace generated placeholders with scoped failure semantics, calibrated uncertainty models, selective prediction, regression controls, and a pinned generation-score source trace."

claims:
  - id: CLM-001
    claim: "Calibration is defined relative to a declared event and population: among predictions assigned confidence q, the event should occur with frequency q in the conditioning limit; a model may be calibrated for one event, dataset, prompt, or subgroup and miscalibrated for another."
    provenance: DERIVED
    domain: calibration
    concepts: [event_definition, population_calibration, conditional_frequency]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "The target event, confidence score, sampling unit, and evaluation population are fixed."
      - "Correctness labels are sufficiently reliable for the stated event."
    derivation: "Calibration compares E[Y | Q=q] with q for binary event Y and forecast Q. Changing Y, the conditioning population, or score semantics changes the estimand."
    limitations:
      - "Finite data require binning, smoothing, or another estimator and cannot establish pointwise equality for every q."
      - "Aggregate calibration can hide subgroup or conditional miscalibration."
    applicability: "Any claim that a model confidence represents probability of answer correctness or another behavioral event."
    curriculum_usage: { lessons: ["7.2"], labs: ["LAB-B"], assessments: ["Mastery-07"] }

  - id: CLM-002
    claim: "Expected calibration error (ECE) is a bin-based empirical summary whose value depends on bin count, bin boundaries, weighting, sample size, and event definition; a low ECE does not by itself prove useful ranking, accuracy, subgroup calibration, or decision utility."
    provenance: DERIVED
    domain: calibration_metrics
    concepts: [expected_calibration_error, binning, estimator_sensitivity]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "Each evaluated item has a scalar confidence and binary correctness label."
      - "The reported estimator uses a declared partition of confidence values."
    derivation: "ECE is the weighted sum over bins of the absolute gap between bin mean confidence and bin empirical accuracy; altering the partition alters both conditional estimates and their gaps."
    evidence:
      - source_type: paper
        tier: 1
        title: "On Calibration of Modern Neural Networks"
        authors: "Chuan Guo, Geoff Pleiss, Yu Sun, Kilian Q. Weinberger"
        year: "2017"
        url: "https://arxiv.org/abs/1706.04599"
        section: "Calibration metrics and temperature scaling"
        accessed_at: "2026-09"
    limitations:
      - "Alternative calibration estimators have different bias and variance; none removes the need to declare the event and population."
    applicability: "Calibration reports for classification-like LLM tasks with a scalar confidence."
    curriculum_usage: { lessons: ["7.2"], labs: ["LAB-B"], assessments: ["Mastery-07"] }

  - id: CLM-003
    claim: "Scalar temperature scaling divides logits by a positive fitted temperature before softmax and therefore preserves their argmax while changing probability sharpness; its calibration benefit is validation-distribution-specific and need not survive task or population shift."
    provenance: VERIFIED_FACT
    domain: calibration_methods
    concepts: [temperature_scaling, logit_calibration, distribution_shift]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    evidence:
      - source_type: paper
        tier: 1
        title: "On Calibration of Modern Neural Networks"
        authors: "Chuan Guo, Geoff Pleiss, Yu Sun, Kilian Q. Weinberger"
        year: "2017"
        url: "https://arxiv.org/abs/1706.04599"
        section: "Temperature scaling"
        accessed_at: "2026-09"
    limitations:
      - "A single temperature cannot repair arbitrary class-, prompt-, subgroup-, or domain-conditional errors."
      - "Free-form sequence correctness is not automatically represented by one next-token softmax."
    applicability: "Post-hoc calibration when logits and representative labeled calibration data are available."
    curriculum_usage: { lessons: ["7.2"], labs: ["LAB-B"], assessments: ["Mastery-07"] }

  - id: CLM-004
    claim: "Ovadia et al. show across their studied image-classification models and shifts that uncertainty quality can degrade under dataset shift; in LLM systems this supports revalidation under prompt, task, language, temporal, retrieval, and model-version changes rather than assuming in-distribution calibration transfers."
    provenance: VERIFIED_FACT
    domain: distribution_shift
    concepts: [shift, calibration_drift, uncertainty_quality]
    confidence: high
    currentness_status: "REFERENCE / CURRENT CAUTION"
    evidence:
      - source_type: paper
        tier: 1
        title: "Can You Trust Your Model's Uncertainty? Evaluating Predictive Uncertainty Under Dataset Shift"
        authors: "Yaniv Ovadia et al."
        year: "2019"
        url: "https://arxiv.org/abs/1906.02530"
        section: "Dataset-shift experiments and conclusions"
        accessed_at: "2026-09"
    limitations:
      - "The original experiments are image classification, so the LLM shift categories are an engineering extension, not a reported result from that paper."
    applicability: "Regression and monitoring plans for confidence estimators deployed outside their calibration population."
    curriculum_usage: { lessons: ["7.2", "7.6"], labs: ["LAB-B", "LAB-D"], assessments: ["Incident-07.1", "Mastery-07"] }

  - id: CLM-005
    claim: "Selective prediction trades coverage for risk by answering only accepted cases; its quality must be reported as a risk-coverage curve or at prespecified operating points because a policy can obtain low risk trivially by abstaining on nearly everything."
    provenance: DERIVED
    domain: selective_prediction
    concepts: [abstention, coverage, selective_risk]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "An acceptance rule maps each item and available score to answer or abstain."
      - "Loss is defined on answered items and coverage is the accepted fraction of the target population."
    derivation: "For accepted set A, coverage=P(A) and selective risk=E[L | A]. Changing the threshold changes both; risk without coverage omits how much traffic was rejected."
    evidence:
      - source_type: paper
        tier: 1
        title: "Selective Classification for Deep Neural Networks"
        authors: "Yonatan Geifman, Ran El-Yaniv"
        year: "2017"
        url: "https://arxiv.org/abs/1705.08500"
        section: "Selective classification problem and risk-coverage definitions"
        accessed_at: "2026-09"
    limitations:
      - "Abstention has its own cost and may shift harm to users or downstream systems."
      - "AUC summaries can hide unacceptable local operating regions or subgroup disparities."
    applicability: "Routing answers to deliver, retry, retrieve, escalate, or abstain."
    curriculum_usage: { lessons: ["7.3"], labs: ["LAB-C"], assessments: ["Mastery-07"] }

  - id: CLM-006
    claim: "Jiang et al. find that examined T5, BART, and GPT-2 QA probabilities are not well calibrated and evaluate several calibration methods; these results are task/model-specific and do not make one confidence construction a universal correctness probability."
    provenance: VERIFIED_FACT
    domain: language_model_calibration
    concepts: [qa_calibration, sequence_confidence, post_hoc_calibration]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    evidence:
      - source_type: paper
        tier: 1
        title: "How Can We Know When Language Models Know? On the Calibration of Language Models for Question Answering"
        authors: "Zhengbao Jiang, Jun Araki, Haibo Ding, Graham Neubig"
        year: "2021"
        url: "https://arxiv.org/abs/2012.00955"
        section: "Abstract, methods, and experiments"
        accessed_at: "2026-09"
    limitations:
      - "Model families and QA formats predate current instruction and reasoning models."
    applicability: "Reference evidence that token/sequence probabilities require event-specific validation and calibration."
    curriculum_usage: { lessons: ["7.2"], labs: ["LAB-B"], assessments: ["Mastery-07"] }

  - id: CLM-007
    claim: "Kadavath et al. report useful calibration and scaling behavior for P(True) and P(IK) in their evaluated models and formats, but also report limited cross-task calibration for P(IK); verbalized or prompted self-evaluation therefore requires per-task validation."
    provenance: VERIFIED_FACT
    domain: self_evaluation
    concepts: [p_true, p_ik, verbalized_confidence]
    confidence: high
    currentness_status: "REFERENCE / WORKLOAD-DEPENDENT"
    evidence:
      - source_type: paper
        tier: 1
        title: "Language Models (Mostly) Know What They Know"
        authors: "Saurav Kadavath et al."
        year: "2022"
        url: "https://arxiv.org/abs/2207.05221"
        section: "P(True), P(IK), calibration, and task transfer experiments"
        accessed_at: "2026-09"
    limitations:
