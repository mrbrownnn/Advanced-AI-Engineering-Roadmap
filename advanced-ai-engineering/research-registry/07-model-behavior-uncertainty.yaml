  - id: CLM-005
    claim: "Selective prediction trades coverage for risk by answering only accepted cases; its quality must be reported as a risk-coverage curve or at prespecified operating points because a policy can obtain low risk trivially by abstaining on nearly everything."
    provenance: DERIVED
    domain: selective_prediction
    concepts: [abstention, coverage, selective_risk]
    confidence: high
    currentness_status: "REFERENCE / BASELINE"
    assumptions:
      - "An acceptance rule maps each item and available score to answer or abstain."
      - "Loss is defined on answered items and coverage is the accepted fraction of the target population."
    derivation: "For accepted set A, coverage=P(A) and selective risk=E[L | A]. Changing the threshold changes both; risk without coverage omits how much traffic was rejected."
    evidence:
      - source_type: paper
        tier: 1
        title: "Selective Classification for Deep Neural Networks"
        authors: "Yonatan Geifman, Ran El-Yaniv"
        year: "2017"
        url: "https://arxiv.org/abs/1705.08500"
        section: "Selective classification problem and risk-coverage definitions"
        accessed_at: "2026-09"
    limitations:
      - "Abstention has its own cost and may shift harm to users or downstream systems."
      - "AUC summaries can hide unacceptable local operating regions or subgroup disparities."
    applicability: "Routing answers to deliver, retry, retrieve, escalate, or abstain."
    curriculum_usage: { lessons: ["7.3"], labs: ["LAB-C"], assessments: ["Mastery-07"] }

