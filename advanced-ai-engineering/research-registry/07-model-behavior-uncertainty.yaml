      - "Processors, warpers, beam search, length, tokenization, and normalization choices affect score semantics."
    applicability: "Source-reading exercise that prevents conflating token likelihood with correctness probability."
    curriculum_usage: { lessons: ["7.2"], labs: ["LAB-B"], assessments: ["Production-Source-Trace"] }

  - id: CLM-015
    claim: "A behavior regression system should detect changes on versioned slices and then test competing causes; an aggregate score can remain stable while severity, subgroup, language, prompt family, temporal knowledge, refusal, or calibration behavior regresses."
    provenance: HYPOTHESIS
    domain: behavior_regression
    concepts: [slice_regression, versioning, causal_diagnosis]
    confidence: high
    currentness_status: "CURRENT DEFAULT"
    hypothesis:
      prediction: "A release-level aggregate can pass while one preregistered high-risk slice shows a practically important behavior or calibration regression."
      measurement_target: "Prompt/model/runtime versions, slice membership, repeated-sample outcomes, severity-weighted failures, confidence and labels, coverage-risk, temporal knowledge date, retrieval/tool state, and paired release deltas with uncertainty."
      falsifying_observation: "All adequately powered preregistered slices remain within equivalence/non-inferiority margins and the apparent regression disappears under label audit and matched reruns."
    limitations:
      - "Slices discovered after observing a failure are exploratory until replicated on held-out data."
      - "No finite suite proves absence of unknown behavior failures."
    applicability: "Pre-release gates, canaries, and post-release incident diagnosis."
    curriculum_usage: { lessons: ["7.6"], labs: ["LAB-D"], assessments: ["Incident-07.1", "Mastery-07"] }
