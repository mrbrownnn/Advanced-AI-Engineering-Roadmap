  - id: "M01-CLM-004b"
    claim: "For a bias-free SwiGLU block with model width d and intermediate width m, the gate, up, and down weight matrices contain 3*d*m scalar parameters."
    provenance: "DERIVED"
    domain: "parameter_accounting"
    concepts: ["swiglu", "gated_mlp", "parameter_count"]
    confidence: "high"
    assumptions:
      - "Gate and up projections each map d to m; the down projection maps m to d."
      - "Biases, quantization metadata, tensor-parallel padding, and adapters are excluded."
    derivation: "The matrices contain d*m, d*m, and m*d entries; summing yields 3*d*m."
    limitations:
      - "A non-gated two-matrix FFN, shared expert, MoE, or architecture-specific MLP requires a different count."
    applicability: "Dense SwiGLU layer accounting."
    related_claims: ["M01-CLM-004"]
    curriculum_usage:
      lessons: ["1.4", "1.5"]
      labs: ["LAB-A", "LAB-C"]
      assessments: ["Mastery-01"]

  - id: "M01-CLM-005"
    claim: "MQA shares one key/value head across query heads, while GQA uses an intermediate number of key/value heads; these designs reduce K/V projection and cache dimensions but do not remove per-query-head attention outputs or guarantee an end-to-end speedup."
    provenance: "VERIFIED_FACT"
    domain: "attention_variants"
    concepts: ["mha", "mqa", "gqa", "kv_heads"]
    confidence: "high"
    evidence:
      - source_type: "paper"
        tier: 1
        title: "Fast Transformer Decoding: One Write-Head is All You Need"
        authors: "Noam Shazeer"
        year: "2019"
        url: "https://arxiv.org/abs/1911.02150"
        section: "Sections 2 and 3"
        accessed_at: "2026-09-25"
      - source_type: "paper"
        tier: 1
        title: "GQA: Training Generalized Multi-Query Transformer Models from Multi-Head Checkpoints"
        authors: "Joshua Ainslie, James Lee-Thorp, Michiel de Jong, Yury Zemlyanskiy, Federico Lebron, Sumit Sanghai"
        year: "2023"
        url: "https://aclanthology.org/2023.emnlp-main.298/"
        section: "Sections 2 and 3"
        accessed_at: "2026-09-25"
    limitations:
      - "Quality, latency, and throughput effects depend on training, batch, sequence length, kernels, cache implementation, and hardware."
    applicability: "Architectural comparison and downstream KV/cache reasoning."
    curriculum_usage:
      lessons: ["1.2", "1.5"]
      labs: ["LAB-B"]
      assessments: ["Mastery-01"]

  - id: "M01-CLM-006"
    claim: "For a bias-free attention block with model width d=H_q*d_h and H_kv key/value heads, Q and output projections contribute 2*d^2 parameters and K/V contribute 2*d*H_kv*d_h, totaling 2*d^2*(1+H_kv/H_q)."
    provenance: "DERIVED"
    domain: "parameter_accounting"
    concepts: ["attention_parameters", "gqa", "shape_algebra"]
    confidence: "high"
    assumptions:
      - "Q has H_q heads, K and V each have H_kv heads, and every head has width d_h."
      - "d=H_q*d_h; projections are dense and bias-free; output projection maps H_q*d_h back to d."
      - "No low-rank adapters, tensor-parallel padding, fused extra projections, or architecture-specific latent compression."
    derivation: "W_q has d*(H_q*d_h)=d^2 entries; W_o has d^2; W_k and W_v each have d*(H_kv*d_h). Substitute d=H_q*d_h."
    limitations:
      - "Storage can include biases, padding, scales, optimizer state, quantization metadata, or tied/shared tensors not counted here."
    applicability: "MHA/MQA/GQA projection accounting before implementation-specific adjustments."
    curriculum_usage:
      lessons: ["1.2", "1.5"]
      labs: ["LAB-B", "LAB-C"]
      assessments: ["Mastery-01"]

  - id: "M01-CLM-007"
    claim: "With one multiply and one add counted as two FLOPs, dense bias-free projections cost approximately two FLOPs per weight use per token; full-sequence QK^T and AV each scale with B*H_q*S^2*d_h, while a causal or fused implementation may avoid materializing or computing parts of the nominal dense matrix."
    provenance: "DERIVED"
    domain: "compute_accounting"
    concepts: ["flop_convention", "attention_complexity", "prefill", "decode"]
    confidence: "high"
    assumptions:
      - "FMA is counted as two FLOPs."
      - "Dense matmuls with batch B, sequence S, and no sparsity or reuse beyond the stated algorithm."
      - "Softmax, normalization, elementwise operations, and data movement are excluded from the leading matmul count."
    derivation: "A matrix multiply of shapes m by k and k by n performs approximately 2*m*n*k FLOPs. Apply this to projections, QK^T, AV, and the three SwiGLU linear maps."
    limitations:
      - "Algorithmic FLOPs are not measured latency; kernel fusion, padding, sparsity, causal tiling, precision, utilization, and memory traffic change realized cost."
      - "Different tools count FMA as one operation, so the convention must accompany every number."
    applicability: "Analytical screening and profiler cross-checks."
    curriculum_usage:
      lessons: ["1.5"]
      labs: ["LAB-C"]
      assessments: ["Mastery-01"]

  - id: "M01-CLM-008"
