module: "01-foundation-model-internals"
registry_version: "1.0.0"
research_cutoff: "2026-09-25"
change_reason: "Initial evidence registry for decoder-only foundation-model internals, with tensor shapes, accounting conventions, architectural variants, and a pinned current Transformers source trace."

out_of_scope_candidates:
  - "KV-cache allocation, paging, reuse, and eviction (Module 03)"
  - "Kernel fusion, FlashAttention implementation, quantization, and speculative decoding (Module 05)"
  - "Tensor, pipeline, expert, and context parallel execution (Module 20)"

claims:
  - id: "M01-CLM-001"
    claim: "Scaled dot-product attention maps queries, keys, and values to softmax(QK^T/sqrt(d_k)+mask)V; multi-head attention applies this mechanism in parallel learned subspaces and combines the head outputs."
    provenance: "VERIFIED_FACT"
    domain: "attention"
    concepts: ["scaled_dot_product_attention", "multi_head_attention", "causal_mask"]
    confidence: "high"
    evidence:
      - source_type: "paper"
        tier: 1
        title: "Attention Is All You Need"
        authors: "Ashish Vaswani, Noam Shazeer, Niki Parmar, Jakob Uszkoreit, Llion Jones, Aidan N. Gomez, Lukasz Kaiser, Illia Polosukhin"
        year: "2017"
        url: "https://proceedings.neurips.cc/paper/2017/hash/3f5ee243547dee91fbd053c1c4a845aa-Abstract.html"
        section: "Sections 3.2.1 and 3.2.2"
        accessed_at: "2026-09-25"
    limitations:
      - "The original paper is an encoder-decoder architecture; modern decoder-only models change normalization, position encoding, activation, attention head sharing, and implementation details."
      - "The equation defines semantics, not a required kernel materialization strategy."
    applicability: "Reference attention semantics and tensor-shape derivation."
    curriculum_usage:
      lessons: ["1.1", "1.2"]
      labs: ["LAB-A"]
      assessments: ["Mastery-01"]

  - id: "M01-CLM-002"
