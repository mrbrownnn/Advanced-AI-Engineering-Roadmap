$schema: "http://json-schema.org/draft-07/schema#"
title: Knowledge Model Schema
type: object
required: [module, registry_version]

definitions:
  traceable_entry: &traceable_entry
    type: array
    items:
      type: object
      required: [id, description]
      properties:
        id: { type: string }
        description: { type: string }
        evidence_ids: { type: array, items: { type: string } }
        derived_from: { type: array, items: { type: string } }

properties:
  module: { type: string }
  registry_version: { type: string }
  status:
    type: string
    enum: [draft, ready]
    description: "Absent means ready. A ready (published) knowledge model must carry content; draft may be incomplete."

  required_concepts: { type: array, items: { type: string } }
  prerequisite_concepts: { type: array, items: { type: string } }
  first_occurrence_concepts: { type: array, items: { type: string } }
  concept_dependencies:
    type: array
    items:
      type: object
      properties:
        concept: { type: string }
        depends_on: { type: array, items: { type: string } }

  mechanisms: *traceable_entry
  mathematical_models: *traceable_entry
  implementation_mechanisms: *traceable_entry
  failure_modes: *traceable_entry
  production_connections: *traceable_entry
  research_connections: *traceable_entry
  todo_verify: *traceable_entry

  candidate_capabilities:
    type: array
    items:
      type: object
      required: [capability, mapped_mechanisms]
      properties:
        capability: { type: string }
        mapped_mechanisms: { type: array, items: { type: string } }

# A ready knowledge model (status absent or "ready") must not be empty.
if:
  not:
    properties:
      status: { const: draft }
    required: [status]
then:
  required: [required_concepts, mechanisms, failure_modes, candidate_capabilities]
  properties:
    required_concepts: { minItems: 1 }
    mechanisms: { minItems: 1 }
    failure_modes: { minItems: 1 }
    candidate_capabilities: { minItems: 1 }
