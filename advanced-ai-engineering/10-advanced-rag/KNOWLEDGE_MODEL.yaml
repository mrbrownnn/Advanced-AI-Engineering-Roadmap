mechanisms:
  - id: "MECH-01"
    description: "A RAG request contract pins query intent/time, corpus or index revision, access policy, transformations, retrieval and context budgets, model/prompt, answer requirements, and citation/abstention policy."
    evidence_ids: ["CLM-001", "CLM-006", "CLM-014"]
    derived_from: []
  - id: "MECH-02"
    description: "Incremental ingestion carries stable document identity and a source-assigned monotonic version through parse, chunk, embed, write, refresh/commit, replicas, routes, and caches. Identity and version are inputs; each representation must apply the atomic acceptance rule of MECH-08 for retries to be idempotent."
    evidence_ids: ["CLM-005", "CLM-006", "CLM-007", "CLM-008", "CLM-018"]
    derived_from: ["MECH-01"]
  - id: "MECH-03"
    description: "Query orchestration conditionally preserves, rewrites, expands, decomposes, or routes a query while retaining lineage and measuring intent drift."
    evidence_ids: ["CLM-009", "CLM-016"]
    derived_from: ["MECH-01"]
  - id: "MECH-04"
    description: "Context assembly selects, deduplicates, orders, and possibly compresses evidence under token, latency, authority, freshness, and contradiction constraints."
    evidence_ids: ["CLM-002", "CLM-003", "CLM-004", "CLM-010"]
    derived_from: ["MECH-01", "MECH-03"]
  - id: "MECH-05"
    description: "Contradiction resolution normalizes claim/entity/time/version, applies source-authority policy, exposes unresolved conflicts, and abstains or branches when evidence is insufficient."
    evidence_ids: ["CLM-011", "CLM-012"]
    derived_from: ["MECH-02", "MECH-04"]
  - id: "MECH-06"
    description: "Citation handling binds answer claims to immutable evidence identifiers and separately evaluates citation correctness (per citation), support completeness (per claim, by entailment), and syntactic citation coverage (per claim, by marker)."
    evidence_ids: ["CLM-013", "CLM-014", "CLM-017", "CLM-020"]
    derived_from: ["MECH-04", "MECH-05"]
  - id: "MECH-07"
    description: "Architecture selection compares retrieval, long-context, and hybrid routes on matched evidence, quality, latency, cost, freshness, and failure slices."
    evidence_ids: ["CLM-003", "CLM-015", "CLM-016"]
    derived_from: ["MECH-01", "MECH-04", "MECH-06"]
  - id: "MECH-08"
    description: "Version acceptance rule, applied atomically per document in every representation: strictly newer version ACCEPT; same version, operation, and hash DUPLICATE (no write, stored outcome returned); same version with different operation or hash CONFLICT; older version STALE; deletes become versioned tombstones retained beyond the maximum event delay and replay window; the source event is acknowledged only after the decision is durable. Consistent with the atomic receiver idempotency contract of Module 14 Lesson 14.2."
    evidence_ids: ["CLM-018", "CLM-019"]
    derived_from: ["MECH-02"]
  - id: "MECH-09"
    description: "Read consistency: a progress watermark reports how far a representation has applied events; a pinned read snapshot is one value per request at which every read, including caches and citation-target fetches, is served. Pinning to an older snapshot needs a retained generation; otherwise the request waits, excludes documents whose versions disagree, or is marked partial. Deletes are enforced by a read-time tombstone overlay regardless of snapshot. A snapshot-bearing cache key is one strategy and does not replace invalidation or version validation."
    evidence_ids: ["CLM-006", "CLM-021"]
    derived_from: ["MECH-02", "MECH-08"]

mathematical_models:
  - id: "MATH-01"
    description: "Visibility lag L_visible=t_query_visible-t_source_event, reported per route (each replica and the cache path separately); stage durations add only along the actual dependency critical path, not automatically as a sum of overlapping work. The post-write portion t_visible-t_write_ack is a different quantity. The lesson ledger is synthetic."
    evidence_ids: ["CLM-005", "CLM-008", "CLM-022"]
    derived_from: ["MECH-02"]
  - id: "MATH-02"
    description: "Citation correctness = supported emitted citations / checked emitted citations (unit: citations). Support completeness = support-required claims whose cited evidence entails them / support-required claims (unit: claims). Citation coverage = support-required claims with at least one marker / support-required claims (syntactic). All three come from one claim-citation table: four claims with three single citations of which two entail give 2/3, 2/4, and 3/4. Multi-citation: the claim is supported if the concatenation entails it; a citation is supported if it entails alone or its removal breaks joint support. A zero denominator is reported as undefined with a count, never as 0 or 1; micro and macro aggregation are declared."
    evidence_ids: ["CLM-013", "CLM-014", "CLM-020"]
    derived_from: ["MECH-06"]
  - id: "MATH-03"
    description: "Context selection is a constrained optimization heuristic: maximize measured downstream utility over selected evidence subject to token, latency, cost, access, freshness, and consistency constraints; no universal utility function is implied."
    evidence_ids: ["CLM-002", "CLM-003", "CLM-010"]
    derived_from: ["MECH-04"]
  - id: "MATH-04"
    description: "Route utility U=Q-lambda_L*L-lambda_C*C is compared only among routes that pass every hard constraint (access, freshness, consistency, latency ceiling, quality floor). Q is a unitless fraction, L is in seconds, C in currency per query, so lambda_L has unit 1/s and lambda_C 1/currency. Weights are product-specific; the decision is reported with the weight value at which it flips. The lesson table is synthetic."
    evidence_ids: ["CLM-015", "CLM-016", "CLM-022"]
    derived_from: ["MECH-07"]

implementation_mechanisms:
  - id: "IMPL-01"
    description: "An indexing ledger records source event, stable ID, source version, content hash, parser/chunker/embedder versions, the acceptance decision (ACCEPT, DUPLICATE, STALE, CONFLICT) per representation, query-visible watermark, tombstone and its retention deadline, retry, and rollback target."
    evidence_ids: ["CLM-005", "CLM-006", "CLM-007", "CLM-018"]
    derived_from: ["MECH-02"]
  - id: "IMPL-02"
    description: "A request trace stores original/transformed queries, route decisions, candidates, selected context and order, snapshot IDs, prompt/model, generated claims, citation bindings, abstention, stage timing, and cost."
    evidence_ids: ["CLM-006", "CLM-009", "CLM-014"]
    derived_from: ["MECH-01", "MECH-03", "MECH-04", "MECH-06"]
  - id: "IMPL-03"
    description: "Pinned Haystack trace shows explicit pipeline dispatch, prompt rendering, document-store writes, and answer/reference binding; semantic citation validation remains a separate responsibility. DocumentWriter passes an ID-based duplicate policy to the store and compares no version, and AnswerBuilder flags referenced documents per reply from a pattern match."
    evidence_ids: ["CLM-017"]
    derived_from: ["MECH-01", "MECH-02", "MECH-06"]

failure_modes:
  - id: "FAIL-01"
    description: "Acknowledged-but-invisible update: ingestion succeeds while refresh/commit, replicas, routing, or caches still serve the old revision."
    evidence_ids: ["CLM-005", "CLM-008"]
    derived_from: ["MECH-02", "MATH-01"]
  - id: "FAIL-02"
    description: "Mixed-version answer: retrieval, context, answer, and citation targets come from incompatible corpus revisions or a deletion propagates to only some representations. A valid progress watermark on each representation does not prevent it."
    evidence_ids: ["CLM-006", "CLM-007", "CLM-021"]
    derived_from: ["MECH-02", "MECH-09"]
  - id: "FAIL-03"
    description: "Rewrite drift improves nominal retrieval while changing negation, entity, identifier, scope, or temporal intent."
    evidence_ids: ["CLM-009"]
    derived_from: ["MECH-03"]
  - id: "FAIL-04"
    description: "Context dilution or position sensitivity causes relevant evidence to be omitted, truncated, duplicated, displaced, or ignored despite higher top-k or a larger window."
    evidence_ids: ["CLM-002", "CLM-003", "CLM-004", "CLM-010"]
    derived_from: ["MECH-04"]
  - id: "FAIL-05"
    description: "Contradiction collapse selects the newest, most frequent, or model-preferred statement without resolving time, authority, entity, or version semantics."
    evidence_ids: ["CLM-011", "CLM-012"]
    derived_from: ["MECH-05"]
  - id: "FAIL-06"
    description: "Citation theater emits valid-looking references that are out of range, point to stale or irrelevant evidence, support only part of a claim, or leave other claims unsupported. Reporting marker coverage as completeness hides it."
    evidence_ids: ["CLM-013", "CLM-014", "CLM-017", "CLM-020"]
    derived_from: ["MECH-06", "MATH-02"]
  - id: "FAIL-07"
    description: "Architecture benchmark leakage compares RAG and long context with different source snapshots, evidence opportunity, models, prompts, budgets, or excluded costs."
    evidence_ids: ["CLM-015"]
    derived_from: ["MECH-07", "MATH-04"]

  - id: "FAIL-08"
    description: "False idempotency: stable IDs and versions exist but the compare and the write are separate steps, the write is last-writer-wins, or a tombstone is collected before a delayed upsert arrives; an older version overwrites a newer one or a deleted document is resurrected."
    evidence_ids: ["CLM-018"]
    derived_from: ["MECH-08"]
  - id: "FAIL-09"
    description: "Cache refill from a lagging replica: an invalidation without a version check lets a stale replica repopulate the cache, so the cached path stays stale after every replica is fresh; refresh lag is then the wrong diagnosis."
    evidence_ids: ["CLM-021", "CLM-022"]
    derived_from: ["MECH-09", "MATH-01"]

production_connections:
  - id: "PROD-01"
    description: "Release an index only after canary queries prove source-to-search visibility, update/delete convergence, version monotonicity, access correctness, and rollback."
    evidence_ids: ["CLM-005", "CLM-006", "CLM-007", "CLM-008", "CLM-018", "CLM-021"]
    derived_from: ["IMPL-01", "FAIL-01", "FAIL-02", "FAIL-08", "FAIL-09"]
  - id: "PROD-02"
    description: "Evaluate RAG using staged opportunity/use/support metrics and matched end-to-end quality, latency, cost, freshness, rejection, and abstention distributions."
    evidence_ids: ["CLM-013", "CLM-014", "CLM-015"]
    derived_from: ["IMPL-02", "MATH-02", "MATH-04"]

research_connections:
  - id: "RESEARCH-01"
    description: "Adaptive/self-corrective retrieval is a promising mechanism family whose evaluator calibration, correlated failures, and extra work remain deployment-specific."
    evidence_ids: ["CLM-016"]
    derived_from: ["MECH-03", "MECH-07"]
  - id: "RESEARCH-02"
    description: "Two published RAG-versus-long-context comparisons (2024 and a late-2024 revisit), checked at abstract level, report setup-dependent outcomes; this argues against assuming a universal winner and motivates matched, slice-aware routing studies. No 2025-2026 primary source on this question was opened for this revision."
    evidence_ids: ["CLM-003", "CLM-015"]
    derived_from: ["MECH-07"]

