  - { capability: "Implement query and context orchestration while testing intent drift, duplication, order, contradiction, and budget effects.", mapped_mechanisms: ["MECH-03", "MECH-04", "MECH-05", "MATH-03", "FAIL-03", "FAIL-04", "FAIL-05"] }
